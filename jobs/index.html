<script>
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const K=['A','B','C','D','E'];
const $=id=>document.getElementById(id);
const V=()=>$('view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=x=>bn(Number.isInteger(x)?x:(Math.round(x*100)/100).toString());
const CAT={bank:{t:'ব্যাংকের পরীক্ষা',m:'বাংলাদেশ ব্যাংক, রাষ্ট্রায়ত্ত ও বেসরকারি ব্যাংকের বিগত নিয়োগ পরীক্ষা',subs:{gb:'সরকারি ব্যাংক ও আর্থিক প্রতিষ্ঠান',pb:'বেসরকারি ব্যাংক'}},
           gov:{t:'সরকারি অন্যান্য চাকরি',m:'মন্ত্রণালয়, কর্পোরেশন, কর্তৃপক্ষ ও সংস্থার ৯ম-১০ম গ্রেডের সাধারণ পদ',subs:{'9':'৯ম গ্রেড','10':'১০ম গ্রেড'}},
           psc:{t:'পিএসসি নন-ক্যাডার',m:'সরকারি কর্ম কমিশনের (পিএসসি) নন-ক্যাডার নিয়োগ পরীক্ষার বিগত প্রশ্ন',subs:{all:'সব পরীক্ষা'},flat:1},
           teacher:{t:'শিক্ষক নিয়োগ ও নিবন্ধন',m:'প্রাথমিক বিদ্যালয় সহকারী শিক্ষক ও শিক্ষক নিবন্ধন (এনটিআরসিএ) পরীক্ষার বিগত প্রশ্ন',subs:{all:'সব পরীক্ষা'},flat:1}};
let CATALOG=null;
const exams=()=>CATALOG.exams;
const catOf=e=>e.cat==='gov'||e.cat==='psc'||e.cat==='teacher'?e.cat:'bank';
const subOf=e=>e.cat==='gov'?String(e.grade):e.cat==='psc'||e.cat==='teacher'?'all':e.cat;
const inSub=(e,c,s)=>catOf(e)===c&&subOf(e)===s;
// flat categories (psc, teacher) skip the sub-category level in links and breadcrumbs
const subCrumb=(c,s)=>CAT[c].flat?[]:[[`#/${c}/${s}`,CAT[c].subs[s]]];
const crumb=parts=>'<nav class="crumb"><a href="#/">প্রশ্নব্যাংক</a>'+parts.map(([h,t])=>h?`<span><a href="${h}">${t}</a></span>`:`<span>${t}</span>`).join('')+'</nav>';
const sum=L=>L.reduce((a,e)=>a+e.n,0);
// fold small subject labels into the main subjects shown on the result screen
const SUBJ={'অর্থনীতি':'ব্যাংকিং ও অর্থনীতি','হিসাববিজ্ঞান ও ফিন্যান্স':'ব্যাংকিং ও অর্থনীতি'};

const bnc=n=>bn(n.toLocaleString('en-IN'));
function home(){
  const L=exams(),orgs=new Set(L.map(e=>catOf(e)+e.org)).size;
  V().innerHTML=`<section class="hero"><h1>সব চাকরির পরীক্ষার প্রশ্ন, এক জায়গায়</h1>
  <p>ব্যাংক, সরকারি চাকরি, পিএসসি নন-ক্যাডার আর শিক্ষক নিয়োগ ও নিবন্ধনের বিগত প্রশ্নে আসল পরীক্ষার মতো অনলাইন পরীক্ষা: সময়, নেগেটিভ মার্কিং, শেষে ফল আর প্রতিটি প্রশ্নের ব্যাখ্যা। সব ফ্রি।</p>
  <div class="stats3"><span><b>${bnc(L.length)}</b>টি পরীক্ষা</span><span><b>${bnc(sum(L))}</b>টি প্রশ্ন</span><span><b>${bnc(orgs)}</b>টি প্রতিষ্ঠান</span></div></section>
  <div class="chips cats"><a class="chip" href="#/all">সব পরীক্ষা</a>${Object.entries(CAT).map(([k,c])=>`<a class="chip" href="#/${k}">${c.t}</a>`).join('')}</div>
  `+listHTML('all',true);
  bindList();
}
function cat(c){
  if(CAT[c].flat)return flatList(c);
  const C=CAT[c],L=exams();
  V().innerHTML=crumb([[null,C.t]])+`<h1>${C.t}</h1><p class="sub">${C.m}</p><div class="grid">${Object.entries(C.subs).map(([s,t])=>{const l=L.filter(e=>inSub(e,c,s));
    return `<a class="card big" href="#/${c}/${s}"><span class="t">${t}</span><span class="m">${bn(new Set(l.map(e=>e.org)).size)}টি প্রতিষ্ঠান · ${bn(l.length)}টি পরীক্ষা</span><span class="go">দেখুন →</span></a>`}).join('')}</div>`;
}
// plain category icon (bank / government office / PSC paper); no logos or abbreviations
const ICON={bank:'<path d="M3 10h18L12 4 3 10z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
  gov:'<rect x="5" y="4" width="14" height="16" rx="1"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10.5 20v-4h3v4"/>',
  psc:'<rect x="5" y="3.5" width="14" height="17" rx="1.5"/><path d="M8.5 8h7M8.5 11.5h7M8.5 15h4.5"/>',
  teacher:'<rect x="3.5" y="4.5" width="17" height="11" rx="1"/><path d="M7 9h6M7 12h4M9 15.5 7.5 20M15 15.5l1.5 4.5"/>'};
function badge(org,name,big,c){
  return `<span class="badge${big?' lg':''}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[c]||ICON.bank}</svg></span>`;
}
function splitName(n){const m=n.match(/^(.*?)\s*\(([^)]+)\)\s*$/);return m&&!/^(বাংলাদেশ|সম্মিলিত)$/.test(m[2])?[m[1],m[2]]:[n,'']}
const groupOf=n=>/^সম্মিলিত/.test(n)?'সম্মিলিত নিয়োগ পরীক্ষা':/ব্যাংক/.test(n)?'ব্যাংক':'অন্যান্য প্রতিষ্ঠান';
const GORDER=['ব্যাংক','সম্মিলিত নিয়োগ পরীক্ষা','অন্যান্য প্রতিষ্ঠান'];
function sub(c,s){
  const C=CAT[c],L=exams().filter(e=>inSub(e,c,s));
  const orgs={};L.forEach(e=>{(orgs[e.org]=orgs[e.org]||{bn:e.orgbn,l:[]}).l.push(e)});
  const O=Object.entries(orgs).sort((a,b)=>sum(b[1].l)-sum(a[1].l));
  const card=([k,o])=>{const [n,ab]=splitName(o.bn);
    return `<a class="oc org" href="#/${c}/${s}/${k}" title="${esc(o.bn)}">${badge(k,o.bn,0,c)}<span class="body"><span class="n">${n}${ab?`<span class="ab">${ab}</span>`:''}</span><span class="f">${bn(o.l.length)}টি পরীক্ষা <span class="cnt">${bn(sum(o.l))} প্রশ্ন</span><span class="go">→</span></span></span></a>`};
  const G={};O.forEach(x=>{const g=c==='bank'?groupOf(x[1].bn):'';(G[g]=G[g]||[]).push(x)});
  const keys=Object.keys(G).sort((a,b)=>GORDER.indexOf(a)-GORDER.indexOf(b));
  V().innerHTML=crumb(C.flat?[[null,C.t]]:[['#/'+c,C.t],[null,C.subs[s]]])+`<h1>${C.flat?C.t:C.subs[s]}</h1><p class="sub">প্রতিষ্ঠান বেছে নিন: ${bn(O.length)}টি প্রতিষ্ঠান, ${bn(L.length)}টি পরীক্ষা।</p>`+
    keys.map(g=>(keys.length>1?`<h2 class="grp">${g}</h2>`:'')+`<div class="ogrid three">${G[g].map(card).join('')}</div>`).join('');
}
// flat category: every exam as a card, newest first, with a search box and year chips
function listHTML(c,home){
  const C=c==='all'?{t:'সব চাকরির পরীক্ষা',m:'ব্যাংক, সরকারি চাকরি, পিএসসি নন-ক্যাডার ও শিক্ষক নিবন্ধন মিলিয়ে সব পরীক্ষা'}:CAT[c],L=exams().filter(e=>c==='all'||catOf(e)===c).sort((a,b)=>(b.year==='misc'?'0':b.date||b.year).localeCompare(a.year==='misc'?'0':a.date||a.year)||b.n-a.n);
  const years=[...new Set(L.map(e=>e.year).filter(y=>y!=='misc'))].sort().reverse();
  const card=e=>`<a class="oc ex" href="#/x/${e.id}" data-y="${e.year}" data-k="${esc((e.orgbn+' '+e.postbn+' '+(e.note||'')).toLowerCase())}"><span class="yr">${e.year==='misc'?'বিবিধ':bn(e.year)}</span><span class="mid"><span class="n">${e.orgbn}</span><span class="src">${e.postbn}${e.note?' · '+e.note:''}</span><span class="cnt">${bn(e.n)} প্রশ্ন</span></span><span class="go">শুরু →</span></a>`;
  return (home?`<h2 class="lh">সব পরীক্ষা, নতুন আগে</h2>`:crumb([[null,C.t]])+`<h1>${C.t}</h1><p class="sub">${C.m}: ${bnc(L.length)}টি পরীক্ষা, ${bnc(sum(L))}টি প্রশ্ন।</p>`)+`
  <input id="fq" type="search" placeholder="পদ বা মন্ত্রণালয়ের নাম লিখে খুঁজুন" style="width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink)">
  <div class="chips yrow" id="fy"><button type="button" class="chip" data-y="" aria-pressed="true">সব বছর</button>${years.map(y=>`<button type="button" class="chip" data-y="${y}" aria-pressed="false">${bn(y)}</button>`).join('')}</div>
  <div class="ogrid three" id="fl">${L.map(card).join('')}</div><p class="load" id="fnone" hidden>কিছু পাওয়া যায়নি।</p>`;
}
function bindList(){
  let yr='';
  const apply=()=>{const q=$('fq').value.trim().toLowerCase();let n=0;[...$('fl').children].forEach(a=>{const ok=(!yr||a.dataset.y===yr)&&(!q||a.dataset.k.includes(q));a.hidden=!ok;n+=ok});$('fnone').hidden=n>0};
  $('fq').oninput=apply;
  $('fy').onclick=ev=>{const b=ev.target.closest('.chip');if(!b)return;yr=b.dataset.y;[...$('fy').children].forEach(x=>x.setAttribute('aria-pressed',x===b));apply()};
}
function flatList(c){V().innerHTML=listHTML(c);bindList()}
function org(c,s,o){
  const C=CAT[c],L=exams().filter(e=>inSub(e,c,s)&&e.org===o);
  if(!L.length)return notFound();
  const nm=L[0].orgbn,[full,ab]=splitName(nm),lab=ab||full;
  L.sort((a,b)=>(b.year==='misc'?'0':b.year).localeCompare(a.year==='misc'?'0':a.year));
  V().innerHTML=crumb([['#/'+c,C.t],...subCrumb(c,s),[null,lab]])+`<div class="ohead">${badge(o,nm,1,c)}<div><h1>${lab}</h1>${ab?`<p class="sub" style="margin:2px 0 0">${full}</p>`:''}</div></div>
  <p class="sub">${bn(L.length)}টি পরীক্ষা, ${bn(sum(L))}টি প্রশ্ন। যে পরীক্ষা দিতে চান, সেটিতে চাপ দিন।</p><div class="tlist">${L.map(e=>{
    const y=e.year==='misc'?'বিবিধ প্রশ্ন':bn(e.year);
    return `<a class="tl" href="#/x/${e.id}"><span class="body"><span class="tt">${lab} ${y}</span><span class="st">${e.postbn}${e.title&&e.title!==e.postbn?' · '+e.title:''} · ${e.full?'পূর্ণ প্রশ্নপত্র':'সংগৃহীত প্রশ্ন'} · ${bn(e.n)}টি প্রশ্ন</span></span><span class="gobtn">শুরু →</span></a>`}).join('')}</div>`;
}
function notFound(){V().innerHTML=crumb([[null,'পাওয়া যায়নি']])+'<h1>পাতাটি পাওয়া যায়নি</h1><p><a href="#/">প্রশ্নব্যাংকে ফিরে যান</a></p>'}

// ---------- পরীক্ষা ----------
let E=null,Q=[],paper=[],pick=[],timer=null,endAt=0,startAt=0,armed=0,NEG=0.5,MIN=0;
const minutesFor=n=>Math.max(5,Math.round(n*0.6));
const histKey=()=>'job-'+E.id;
function store(get,val){try{if(get)return JSON.parse(localStorage.getItem(histKey())||'[]');localStorage.setItem(histKey(),JSON.stringify(val))}catch(e){return []}}
const title=e=>`${e.orgbn}: ${e.title||e.postbn}${e.year==='misc'?'':' '+bn(e.year)}`;
async function exam(id){
  E=exams().find(e=>e.id===id); if(!E)return notFound();
  V().innerHTML='<p class="load">প্রশ্ন লোড হচ্ছে…</p>';
  try{Q=await (await fetch('data/e/'+id+'.json')).json()}catch(err){V().innerHTML='<p class="load">প্রশ্ন লোড হয়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p>';return}
  const c=catOf(E), s=subOf(E);
  MIN=E.time?+E.time:minutesFor(Q.length);
  document.title=title(E)+' · প্রশ্নব্যাংক';
  V().innerHTML=crumb([['#/'+c,CAT[c].t],...subCrumb(c,s),...(CAT[c].flat?[]:[[`#/${c}/${s}/${E.org}`,E.orgbn]]),[null,E.year==='misc'?'বিবিধ':bn(E.year)]])+
  `<section id="start"><h1>${title(E)}</h1>
   <p class="sub">${E.full?'পুরো প্রশ্নপত্র':'এই পরীক্ষার সংগৃহীত প্রশ্ন'} · ${bn(Q.length)}টি প্রশ্ন</p>
   <div class="btns start"><button class="btn" id="go" type="button">পরীক্ষা শুরু করুন →</button><button class="btn ghost" id="practice" type="button">অনুশীলন (সঙ্গে সঙ্গে উত্তর)</button></div>
   <ul class="rules"><li>প্রশ্ন ${bn(Q.length)}টি, সময় <b>${bn(MIN)}</b> মিনিট। সময় শেষ হলে নিজে থেকেই জমা হবে।</li>
   <li>সঠিক উত্তরে ১ নম্বর, ভুল উত্তরে <b id="negt">−০.৫</b>। উত্তর না দিলে নম্বর কাটা যায় না।</li>
   <li>শেষে ফল, বিষয়ভিত্তিক হিসাব আর প্রতিটি প্রশ্নের ব্যাখ্যা দেখাবে।</li></ul>
   <p class="lbl">নেগেটিভ মার্কিং</p><div class="chips" id="negc"><button type="button" class="chip" data-v="0.5" aria-pressed="true">−০.৫</button><button type="button" class="chip" data-v="0.25" aria-pressed="false">−০.২৫</button><button type="button" class="chip" data-v="0" aria-pressed="false">নেই</button></div>
   <div class="hist" id="hist" hidden></div></section>
  <section id="exam" hidden><div class="bar"><span class="clock" id="clock"></span><span>উত্তর <b id="ans">০</b> / <b>${bn(Q.length)}</b></span><button class="btn" id="submit" type="button">জমা দিন</button></div><main id="elist"></main><div class="btns"><button class="btn" id="submit2" type="button">জমা দিন</button></div></section>
  <section id="result" hidden><div class="score" id="scorebox"></div><div id="weak"></div><div class="btns"><button class="btn" id="again" type="button">আবার পরীক্ষা দিন</button><a class="btn ghost" href="${CAT[c].flat?'#/'+c:`#/${c}/${s}/${E.org}`}">অন্য পরীক্ষা</a></div><h2>উত্তর ও ব্যাখ্যা</h2><main id="rlist"></main></section>
  <section id="prac" hidden><div class="bar"><span>সঠিক <b id="pok">০</b> / উত্তর <b id="pdone">০</b> / মোট <b id="ptot">০</b></span><button class="btn ghost" id="back" type="button">শুরুর পাতা</button></div><div class="chips" id="chips"></div><main id="plist"></main></section>`;
  const dn=E.neg!=null?String(E.neg):'0.5';try{NEG=parseFloat(localStorage.getItem('job-neg')||dn)}catch(e){NEG=parseFloat(dn)}
  setNeg(NEG);
  $('negc').onclick=ev=>{const v=ev.target.dataset&&ev.target.dataset.v;if(v===undefined)return;setNeg(parseFloat(v));try{localStorage.setItem('job-neg',v)}catch(e){}};
  $('go').onclick=$('again').onclick=startExam;
  $('submit').onclick=$('submit2').onclick=askSubmit;
  $('practice').onclick=()=>{renderPrac('all');show('prac')};
  $('back').onclick=()=>{show('start');drawHist()};
  drawHist();window.scrollTo(0,0);
}
function setNeg(v){NEG=v;[...$('negc').children].forEach(c=>c.setAttribute('aria-pressed',parseFloat(c.dataset.v)===v));$('negt').textContent=v?'−'+bn(v):'০ (নেগেটিভ নেই)'}
const show=id=>{['start','exam','result','prac'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)};
const qhtml=(q,i)=>`<div class="qh"><span class="num">${bn(i+1)}.</span><div class="qt">${q.q.includes('<table')?'<div class="tb">'+q.q+'</div>':q.q}<span class="src">${esc(q.s||'')}${q.x?' · '+esc(q.x):''}</span></div></div>`;
function drawHist(){
  const h=store(true)||[],el=$('hist');if(!h.length){el.hidden=true;return}
  el.hidden=false;el.innerHTML='<b>এই ফোনে আগের ফল</b><table><tr><th>তারিখ</th><th>নম্বর</th><th>নেগেটিভ</th></tr>'+h.slice(-8).map(r=>`<tr><td>${r.d}</td><td>${fmt(r.s)} / ${bn(r.n)}</td><td>${r.g?'−'+bn(r.g):'নেই'}</td></tr>`).join('')+'</table>';
}
function startExam(){
  paper=Q.map((q,i)=>i); pick=paper.map(()=>-1);
  const box=$('elist');box.innerHTML='';
  paper.forEach((qi,i)=>{const q=Q[qi];
    const s=document.createElement('section');s.className='q';s.innerHTML=qhtml(q,i)+'<div class="opts"></div>';
    const o=s.querySelector('.opts');
    q.o.forEach((t,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=`<span class="k">${K[j]}</span><span>${t}</span>`;
      b.onclick=()=>{pick[i]=pick[i]===j?-1:j;[...o.children].forEach((x,k)=>x.classList.toggle('sel',k===pick[i]));$('ans').textContent=bn(pick.filter(x=>x>=0).length)};o.appendChild(b)});
    box.appendChild(s)});
  $('ans').textContent='০';startAt=Date.now();endAt=startAt+MIN*60000;tick();clearInterval(timer);timer=setInterval(tick,500);show('exam');
}
function tick(){const left=Math.max(0,endAt-Date.now()),s=Math.ceil(left/1000);
  $('clock').textContent=bn(String(Math.floor(s/60)).padStart(2,'0'))+':'+bn(String(s%60).padStart(2,'0'));$('clock').classList.toggle('low',s<=60);if(left<=0)finish()}
function askSubmit(){
  const blank=pick.filter(x=>x<0).length;
  if(armed&&Date.now()-armed<4000){finish();return}
  armed=Date.now();[$('submit'),$('submit2')].forEach(b=>b.textContent=blank?`${bn(blank)}টি বাকি, তবু জমা দিতে আবার চাপুন`:'নিশ্চিত হলে আবার চাপুন');
  setTimeout(()=>{if(Date.now()-armed>=4000)[$('submit'),$('submit2')].forEach(b=>b.textContent='জমা দিন')},4100);
}
function finish(){
  clearInterval(timer);armed=0;
  let ok=0,bad=0;const bys={};
  const byt={};
  paper.forEach((qi,i)=>{const q=Q[qi],k=SUBJ[q.s]||q.s||'অন্যান্য',t=q.t?k+': '+q.t:k;bys[k]=bys[k]||[0,0,0];bys[k][2]++;const T=byt[t]=byt[t]||[0,0];T[1]++;
    if(pick[i]===q.a)T[0]++;if(pick[i]<0)return;if(pick[i]===q.a){ok++;bys[k][0]++}else{bad++;bys[k][1]++}});
  const n=paper.length,blank=n-ok-bad,score=ok-bad*NEG,used=Math.min(MIN*60,Math.round((Date.now()-startAt)/1000));
  const d=new Date(),ds=bn(d.getDate())+'/'+bn(d.getMonth()+1)+'/'+bn(d.getFullYear());
  const h=store(true)||[];h.push({d:ds,s:score,n,g:NEG});store(false,h);
  const pc=score/n;
  $('scorebox').innerHTML=`<div class="big">${fmt(score)} / ${bn(n)}</div>
   <div class="stats"><span class="ok">সঠিক ${bn(ok)}</span><span class="no">ভুল ${bn(bad)}</span><span class="skip">উত্তর দেননি ${bn(blank)}</span><span>সময় ${bn(Math.floor(used/60))} মিনিট ${bn(used%60)} সেকেন্ড</span></div>
   ${Object.keys(bys).length>1?`<div class="sbg">${Object.entries(bys).map(([k,v])=>`<div class="sb${v[0]/v[2]<.5?' low':''}"><span>${esc(k)}</span><b>${bn(v[0])}/${bn(v[2])}</b><span class="mb"><i style="width:${Math.round(v[0]*100/v[2])}%"></i></span></div>`).join('')}</div>`:''}`;
  // weak = under 60% correct with at least 3 questions (topic where tagged, else subject), weakest first
  const rows=Object.entries(byt).map(([t,v])=>({t,ok:v[0],n:v[1],r:v[0]/v[1]})).sort((a,b)=>a.r-b.r||b.n-a.n);
  const weak=rows.filter(r=>r.n>=3&&r.r<.6).slice(0,5);
  const wbox=rows.length>1?`<div class="wk"><h2>দুর্বল জায়গা</h2>${weak.length?`<ul class="wl">${weak.map(r=>`<li><b>${esc(r.t)}</b> <span class="wn">${bn(r.ok)}/${bn(r.n)} সঠিক</span></li>`).join('')}</ul>`:'<p class="wtip">কোনো বিষয়ে বড় দুর্বলতা নেই। চমৎকার!</p>'}
    <details><summary>সব বিষয়ের ফল</summary><table>${rows.map(r=>`<tr class="${r.n>=3&&r.r<.6?'low':''}"><td>${esc(r.t)}</td><td>${bn(r.ok)}/${bn(r.n)}</td><td><span class="mb"><i style="width:${Math.round(r.r*100)}%"></i></span></td></tr>`).join('')}</table></details></div>`:'';
  const tip=[];
  if(weak.length)tip.push(`নিচের ব্যাখ্যায় আগে <b>${esc(weak[0].t)}</b>${weak[1]?' ও <b>'+esc(weak[1].t)+'</b>':''}-এর ভুলগুলো পড়ুন, তারপর ২-৩ দিন পর পরীক্ষাটা আবার দিন।`);
  if(NEG&&bad>=Math.max(3,ok*.4))tip.push(`ভুলের জন্য ${fmt(bad*NEG)} নম্বর কাটা গেছে। পুরো নিশ্চিত না হলে, অন্তত দুটি অপশন বাদ দিতে না পারলে উত্তর ছেড়ে দিন।`);
  if(blank>=Math.max(4,n*.2))tip.push(used>=MIN*60-5?`সময় শেষ হয়ে ${bn(blank)}টি প্রশ্ন বাকি ছিল। যেটা জানেন সেটা আগে করুন, কঠিন প্রশ্নে আটকে থাকবেন না।`:`${bn(blank)}টি প্রশ্ন ছেড়ে দিয়েছেন। এগুলোর ব্যাখ্যা পড়ে নিন, পরীক্ষায় এ ধরনের প্রশ্ন আবার আসে।`);
  if(!tip.length)tip.push(pc>=.7?'চমৎকার ফল! ভুল কয়েকটির ব্যাখ্যা দেখে আরেকটি পরীক্ষা দিন।':'ভুল ও ছেড়ে দেওয়া প্রশ্নগুলোর ব্যাখ্যা মন দিয়ে পড়ুন, তারপর আরেকটি পরীক্ষা দিন।');
  $('weak').innerHTML=wbox+`<div class="wk tipbox"><h2>এখন কী করবেন</h2><ul>${tip.slice(0,3).map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  const box=$('rlist');box.innerHTML='';
  paper.forEach((qi,i)=>{const q=Q[qi],p=pick[i];
    const s=document.createElement('section');s.className='q';
    s.innerHTML=qhtml(q,i)+`<div class="opts">${q.o.map((t,j)=>`<button type="button" class="opt${j===q.a?' right':''}${j===p&&p!==q.a?' wrong':''}" disabled><span class="k">${K[j]}</span><span>${t}</span></button>`).join('')}</div>
     <div class="exp">${p<0?'<span class="skip">উত্তর দেননি।</span> সঠিক উত্তর: '+K[q.a]+'।':p===q.a?'<span class="ok">সঠিক (+১)।</span>':'<span class="no">ভুল ('+(NEG?'−'+bn(NEG):'০')+')।</span> সঠিক উত্তর: '+K[q.a]+'।'} ${q.e||''}<a class="bl" href="../book/">লিয়ানা বুকস · ‘লিয়ানা বিসিএস বিজ্ঞান’ বইটি দেখুন →</a></div>`;
    box.appendChild(s)});
  show('result');drawHist();
}
function renderPrac(f){
  const subs=[...new Set(Q.map(q=>q.s).filter(Boolean))];
  $('chips').innerHTML=subs.length>1?[['all','সব'],...subs.map(s=>[s,s])].map(([k,t])=>`<button type="button" class="chip" data-k="${esc(k)}" aria-pressed="${k===f}">${esc(t)}</button>`).join(''):'';
  $('chips').onclick=ev=>{const k=ev.target.dataset&&ev.target.dataset.k;if(k)renderPrac(k)};
  const L=Q.filter(q=>f==='all'||q.s===f);let ok=0,done=0;
  const upd=()=>{$('pok').textContent=bn(ok);$('pdone').textContent=bn(done);$('ptot').textContent=bn(L.length)};
  const box=$('plist');box.innerHTML='';
  L.forEach((q,i)=>{const s=document.createElement('section');s.className='q';s.innerHTML=qhtml(q,i)+'<div class="opts"></div>';
    const o=s.querySelector('.opts');
    q.o.forEach((t,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=`<span class="k">${K[j]}</span><span>${t}</span>`;
      b.onclick=()=>{[...o.children].forEach(x=>x.disabled=true);o.children[q.a].classList.add('right');const g=j===q.a;if(!g)b.classList.add('wrong');done++;if(g)ok++;upd();
        const e=document.createElement('div');e.className='exp';e.innerHTML=`<span class="${g?'ok':'no'}">${g?'সঠিক।':'ভুল। সঠিক উত্তর: '+K[q.a]+'।'}</span> ${q.e||''}<a class="bl" href="../book/">লিয়ানা বুকস · ‘লিয়ানা বিসিএস বিজ্ঞান’ বইটি দেখুন →</a>`;s.appendChild(e)};o.appendChild(b)});
    box.appendChild(s)});
  upd();
}

// ---------- রাউটার ----------
function route(){
  if($('exam')&&!$('exam').hidden&&timer){/* পরীক্ষা চলাকালে অন্য পাতায় গেলে টাইমার বন্ধ */clearInterval(timer);timer=null}
  document.title='চাকরির প্রশ্নব্যাংক · লিয়ানা বুকস';
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(!p.length)return home();
  if(p[0]==='x')return exam(p[1]);
  if(p[0]==='all')return flatList('all');
  if(!CAT[p[0]])return notFound();
  if(p.length===1)return cat(p[0]);
  if(!CAT[p[0]].subs[p[1]])return notFound();
  if(p.length===2)return sub(p[0],p[1]);
  org(p[0],p[1],p[2]);window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
window.addEventListener('beforeunload',e=>{if($('exam')&&!$('exam').hidden){e.preventDefault();e.returnValue=''}});
fetch('data/catalog.json').then(r=>r.json()).then(c=>{CATALOG=c;route()}).catch(()=>{V().innerHTML='<p class="load">তালিকা লোড হয়নি। আবার চেষ্টা করুন।</p>'});
</script>
