.tile .tx{display:flex;flex-direction:column;line-height:1.35;min-width:0}.tile .tx b{font-weight:600;font-size:17px}.tile .tx small{font-size:13px;color:var(--muted)}
.tile .bt{background:var(--navy);color:#fff;font-weight:600;font-size:15px;border-radius:9px;padding:9px 12px;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile .ic{color:#e6c97a}}

.run{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 0;padding:12px 14px;border:1px solid var(--gold-hi);border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none}
.run b{display:block;font-size:17px}.run small{color:var(--muted);font-size:13px}
.run .go{flex-shrink:0;color:var(--gold);font-weight:600}
