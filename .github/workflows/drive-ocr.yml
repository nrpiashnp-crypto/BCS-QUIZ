name: drive-ocr
# ক্লাউড Drive-OCR: Drive-এর `Lyanna Drive/ocr-input/<ফোল্ডার>` → Gemini batch (Vertex) → ফল প্রাইভেট Lyanna_data-র
# `inbox/ocr-<বই>` ব্রাঞ্চে, অবস্থা Lyanna_data-র `status/ocr-cloud.md`-এ।
# পাবলিক রিপোতে চলে বলে GitHub-এর মিনিট লাগে না। কোড, তালিকা আর ফল সবই প্রাইভেট Lyanna_data-তে;
# এই রিপোতে কিছু লেখা হয় না। লগ সবাই দেখতে পারে, তাই স্ক্রিপ্টের লেখা ছাঁকনি দিয়ে যায়
# (শুধু ছোট খবর: ফোল্ডার/বইয়ের নাম, পাতা, খরচ; লম্বা বাংলা লেখা বা Traceback-এর কোড-লাইন লুকানো)।
# - প্রতি ঘণ্টায় দেখে: তালিকায় (Lyanna_data: status/ocr-queue.md) নতুন ফোল্ডার/ফাইল জমা, শেষ হওয়া batch নামানো।
# - হাতে: Actions → drive-ocr → Run workflow ("শুধু দেখা" টিক দিলে কিছু জমা হয় না)।
# লাগে: Variables GCP_WIF_PROVIDER, GCP_SA (চাবি নয়, ঠিকানা); Secret LYANNA_OCR_TOKEN
# (Lyanna_data-তে Contents: Read and write, শুধু ওই রিপো)। Variable না থাকলে কিছুই চলে না।
# নিয়ম: Lyanna_data-র tools/gemini-ocr/README.md ("ক্লাউড" অংশ)।
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'শুধু দেখা (কিছু জমা নয়)'
        type: boolean
        default: false

concurrency:
  group: drive-ocr
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: vars.GCP_WIF_PROVIDER != '' && github.ref == 'refs/heads/main'
    env:
      LYANNA_OCR_HOME: /home/runner/lyanna-ocr-cloud
      STATE_URI: gs://lyanna-books-ocr/cloud-state
      CLOUDSDK_CORE_VERBOSITY: error
    defaults:
      run:
        shell: bash
        working-directory: data
    steps:
      - name: Lyanna_data আনা (শুধু OCR-এর কোড আর তালিকা)
        uses: actions/checkout@v4
        with:
          repository: nrpiashnp-crypto/Lyanna_data
          token: ${{ secrets.LYANNA_OCR_TOKEN }}
          path: data
          sparse-checkout: |
            /tools/gemini-ocr/
            /status/ocr-queue.md
            /status/ocr-cloud.md
            /inbox/ocr-*/
          sparse-checkout-cone-mode: false

      - name: তালিকায় কটা ফোল্ডার (খালি হলে জমার ধাপ বাদ)
        id: need
        run: |
          n=$(awk '/^## তালিকা/{f=1;next} /^## /{f=0} f && /^- /' status/ocr-queue.md | wc -l)
          echo "তালিকায় ফোল্ডার: $n"
          echo "queue=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: pip install -q google-auth requests
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: ছাঁকনি বানানো (পাবলিক লগে বইয়ের লেখা নয়)
        run: |
          cat > "$RUNNER_TEMP/quiet.py" <<'PY'
          import re, sys
          BN = re.compile(r"[ঀ-৿]+")
          for line in sys.stdin:
              line = line.rstrip("\n")
              if line.startswith(("    ", "\t")):
                  continue                                  # Traceback-এর কোড-লাইন (প্রাইভেট কোড) বা লেখার ভেতরের লাইন
              if len(BN.findall(line)) > 25 or len(line) > 300:
                  line = "[লম্বা লেখা লুকানো]"
              print(line, flush=True)
          PY

      - name: আগের অবস্থা আনা (job-তালিকা, খরচ, ফলের লেখা)
        run: |
          mkdir -p "$LYANNA_OCR_HOME"
          gcloud storage rsync -r "$STATE_URI" "$LYANNA_OCR_HOME" >/dev/null 2>&1 || echo "আগের অবস্থা নেই (প্রথমবার)"

      - name: শেষ হওয়া batch নামানো
        run: |
          set -o pipefail
          python3 tools/gemini-ocr/drive_cloud.py fetch --export "$RUNNER_TEMP/export" 2>&1 | python3 "$RUNNER_TEMP/quiet.py"

      - name: তালিকার নতুন ফাইল জমা
        if: steps.need.outputs.queue != '0'
        run: |
          set -o pipefail
          python3 tools/gemini-ocr/drive_cloud.py submit ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | python3 "$RUNNER_TEMP/quiet.py"

      - name: অবস্থা রাখা (ছবি আর মূল PDF বাদ)
        if: always()
        run: |
          [ -d "$LYANNA_OCR_HOME" ] && gcloud storage rsync -r \
            --exclude '^src/|.*\.(jpg|jpeg|png|webp|tif|tiff|heic|part)$' \
            "$LYANNA_OCR_HOME" "$STATE_URI" >/dev/null 2>&1 || echo "অবস্থা রাখা গেল না"
          # bucket ৩০ দিনে পুরোনো ফাইল মোছে: হিসাবের ফাইলগুলো প্রতিবার নতুন করে রাখা
          gcloud storage cp "$LYANNA_OCR_HOME"/*.json "$STATE_URI/" >/dev/null 2>&1 || true

      - name: ফল Lyanna_data-র inbox ব্রাঞ্চে, অবস্থা main-এ
        if: always()
        run: |
          set -e
          git config user.name "lyanna-ocr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/gemini-ocr/drive_cloud.py report --report "$RUNNER_TEMP/ocr-cloud.md" 2>&1 | python3 "$RUNNER_TEMP/quiet.py"
          main=$(git rev-parse HEAD)
          for b in $(cat "$RUNNER_TEMP/export/books.txt" 2>/dev/null); do
            br="inbox/ocr-$b"
            if git fetch -q --depth 1 origin "$br" 2>/dev/null; then git checkout -q -B "$br" FETCH_HEAD; else git checkout -q -B "$br" "$main"; fi
            mkdir -p "inbox/ocr-$b"
            cp "$RUNNER_TEMP/export/$b/"* "inbox/ocr-$b/"
            git add --sparse "inbox/ocr-$b"
            git diff --cached --quiet || git commit -q -m "ocr: $b (Gemini batch, ক্লাউড) [skip ci]"
            git push -q origin "HEAD:$br" >/dev/null 2>&1
            echo "ফল গেল: Lyanna_data ব্রাঞ্চ $br"
          done
          git checkout -q -B main "$main"
          for i in 1 2 3; do
            git pull -q --rebase origin main >/dev/null 2>&1 || true
            cp "$RUNNER_TEMP/ocr-cloud.md" status/ocr-cloud.md
            git add status/ocr-cloud.md
            git diff --cached --quiet && break
            git commit -q -m "status: ক্লাউড OCR-এর অবস্থা [skip ci]"
            git push -q origin HEAD:main >/dev/null 2>&1 && { echo "অবস্থা হালনাগাদ হলো"; break; }
            git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD
          done
