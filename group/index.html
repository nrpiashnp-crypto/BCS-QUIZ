<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13294b">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>পড়ার দল · লিয়ানা বুকস</title>
<meta name="description" content="বন্ধুদের নিয়ে পড়ার দল: কে এই সপ্তাহে কত দিন পড়লেন, এখন কে পড়ছেন। নম্বর কেউ দেখে না।">
<meta property="og:title" content="পড়ার দল · লিয়ানা বুকস">
<meta property="og:description" content="বন্ধুদের নিয়ে একসাথে প্রস্তুতি। সব পরীক্ষা ফ্রি।">
<link rel="canonical" href="https://lyannabooks.com/group/">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo/final-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* পড়ার দল (কাজের ক্রমের ধাপ ৬; claude.ai প্রজেক্ট LY Sites-এর social-review.md ঙ-৬/৭, জ)। একটাই অনুরোধ GET /api/grp।
   তালিকা কাজে সাজানো, নম্বর-সময় কারও নয়; বার্তা শুধু বাঁধা বোতাম; "এখন পড়ছেন" শেষ ৬ মিনিটের "আছি" থেকে। */
:root{--paper:#f8f5ee;--ink:#1d1f21;--muted:#5d5a55;--rule:#e6d3d9;--card:#fffdf7;--navy:#13294b;--pink:#c8326a;--live:#1f6b3a;
  --body:'Noto Sans Bengali',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:var(--navy)}
.sitebar .who{color:var(--muted);font-size:15px;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px}
h1{font:600 22px/1.3 'Tiro Bangla',serif;margin:0}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px}
p{margin:0 0 8px}
.mut{color:var(--muted)}.sm{font-size:14px}
.box{background:var(--card);border:1.4px solid rgba(200,50,106,.45);border-radius:3px;padding:14px}
.big{font-size:18px;font-weight:600;line-height:1.4;margin:0 0 4px}
.btn{display:block;width:100%;text-align:center;background:var(--navy);color:#fff;border:0;border-radius:3px;padding:13px;font:600 17px/1.3 var(--body);text-decoration:none;margin-top:10px;cursor:pointer}
button.btn.line{background:var(--card);color:var(--navy);border:1.4px solid var(--pink);font-size:16px;padding:11px}
.btn:disabled{opacity:.55;cursor:default}
input.nm{width:100%;font:16px var(--body);padding:11px;border:1.4px solid var(--pink);border-radius:3px;background:#fff;margin-top:8px}
section.part{border-top:1px solid var(--rule);margin-top:18px;padding-top:14px}
.lbl{font-size:14px;color:var(--muted);margin:0 0 6px}
.livel{color:var(--live);font-weight:600;margin:0 0 4px}
ol.mem{list-style:none;margin:0;padding:0}
ol.mem li{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
ol.mem li:last-child{border-bottom:0}
ol.mem .n{font-weight:600;min-width:5.5em}
ol.mem .w{flex:1;font-size:15px;color:var(--muted)}
ol.mem .on{color:var(--live);font-size:14px;font-weight:600;white-space:nowrap}
ol.mem .on::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px}
.kick{background:none;border:0;color:var(--muted);font:13px var(--body);text-decoration:underline;cursor:pointer;padding:0}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.keys button{background:var(--card);color:var(--navy);border:1.4px solid var(--pink);border-radius:3px;padding:10px 6px;font:15px/1.35 var(--body);cursor:pointer}
.keys button:disabled{opacity:.55}
ul.msgs{list-style:none;margin:12px 0 0;padding:0;font-size:15px}
ul.msgs li{padding:4px 0}
ul.msgs b{font-weight:600}
ul.msgs .t{color:var(--muted);font-size:13px;margin-left:6px}
.lnk{background:none;border:0;padding:6px 0;color:var(--muted);font:14px var(--body);text-decoration:underline;cursor:pointer}
.wait{color:var(--muted)}
</style>
<link rel="stylesheet" href="/css/omr.css">
</head>
<body>
<div class="sitebar"><a href="/" aria-label="লিয়ানা বুকস"><img src="/img/logo/li-mark.svg" alt="" width="34" height="44"><span class="lgn-n">লিয়ানা বুকস</span></a><a class="who" href="/today/" id="who"></a></div>
<main class="wrap" id="app"><p class="wait">খোলা হচ্ছে…</p></main>
<script src="/js/account.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
function ago(ts){const m=Math.round((Date.now()-ts)/60e3);if(m<2)return 'এইমাত্র';if(m<60)return bn(m)+' মিনিট আগে';const h=Math.round(m/60);if(h<24)return bn(h)+' ঘণ্টা আগে';return bn(Math.round(h/24))+' দিন আগে'}
// দলের লিংক /group/?t=… : টোকেন এই ফোনে রাখা, লগইনের পরেও থাকে ("আজ" পাতাও দেখায়)
let TOK='';
try{const q=new URLSearchParams(location.search).get('t');if(q&&/^[A-Za-z0-9]{6,20}$/.test(q)){localStorage.setItem('lb:gt',q);history.replaceState(null,'',location.pathname)}TOK=localStorage.getItem('lb:gt')||''}catch(e){}
const dropTok=()=>{try{localStorage.removeItem('lb:gt')}catch(e){}TOK=''};
const ERR={gone:'লিংকটা আর চলে না। দলের কাউকে নতুন লিংক পাঠাতে বলুন।',ingroup:'আপনি আগেই একটা দলে আছেন। নতুন দলে যেতে আগে সেটা ছাড়ুন।',already:'আপনি এই দলেই আছেন।',
  full:'দলে ইতিমধ্যে ১০ জন। এর বেশি নেওয়া যায় না।',name:'দলের একটা ছোট নাম লিখুন (লিংক বা ফোন নম্বর নয়)।',many:'আজ আর বার্তা পাঠানো যাবে না (দিনে ১০টা)।',owner:'শুধু দলের মালিক এটা পারেন।'};
async function post(p,b){const r=await fetch('/api/grp/'+p,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).catch(()=>null);return r?{ok:r.ok,j:await r.json().catch(()=>({}))}:{ok:false,j:{}}}
const say=t=>{const m=$('msg');if(m)m.textContent=t};
const invInfo=()=>TOK?fetch('/api/grp/inv?t='+encodeURIComponent(TOK)).then(r=>r.ok?r.json():null).catch(()=>null):Promise.resolve(null);

async function login(){
  const i=await invInfo();
  $('app').innerHTML=`<h1>পড়ার দল</h1><p class="sub">বন্ধুদের সঙ্গে একসাথে প্রস্তুতি</p><div class="box">${i?`<p class="big">${esc(i.owner)}-এর দল “${esc(i.name)}”-এ আপনাকে ডাকা হয়েছে</p>
    <p class="sm mut">দলে এখন ${bn(i.n)} জন। দলে সবাই দেখেন কে এই সপ্তাহে কত দিন পড়লেন আর এখন কে পড়ছেন। নম্বর কেউ দেখে না। লিয়ানা বুকসের সব পরীক্ষা ফ্রি।</p>`
    :'<p>দলের তালিকা আর বার্তা দেখতে লগইন করুন।</p>'}<a class="btn" href="/account/">Google দিয়ে লগইন করুন</a></div>`;
}

async function noGroup(){
  const i=await invInfo();if(!i)dropTok();
  if(i)return $('app').innerHTML=`<h1>পড়ার দল</h1><p class="sub">বন্ধুদের সঙ্গে একসাথে প্রস্তুতি</p><div class="box">
    <p class="big">${esc(i.owner)}-এর দল “${esc(i.name)}”</p><p class="sm mut">দলে এখন ${bn(i.n)} জন (সর্বোচ্চ ১০)। সবাই দেখবেন আপনি এই সপ্তাহে কত দিন পড়লেন, নম্বর নয়।</p>
    ${i.full?'<p>দল ভরে গেছে।</p>':'<button class="btn" data-a="join">দলে যোগ দিন</button>'}<button class="btn line" data-a="skip">এখন নয়</button><p class="sm mut" id="msg"></p></div>`,bind();
  $('app').innerHTML=`<h1>পড়ার দল</h1><p class="sub">বন্ধুদের সঙ্গে একসাথে প্রস্তুতি</p><div class="box">
    <p>২ থেকে ১০ জন বন্ধু মিলে দল বানান। দলে দেখা যায় কে এই সপ্তাহে কত দিন পড়লেন, এখন কে পড়ছেন, আর ছোট বাঁধা বার্তা ("আজ পড়লাম ✔")। নম্বর বা সময় কেউ দেখে না।</p>
    <label class="sm mut" for="nm">দলের নাম</label><input class="nm" id="nm" maxlength="30" placeholder="যেমন: পেট্রোবাংলা প্রস্তুতি">
    <button class="btn" data-a="new">দল বানান</button><p class="sm mut" id="msg"></p></div>
    <p class="sm mut" style="margin-top:14px">বন্ধু দল বানিয়ে থাকলে তাঁর পাঠানো লিংক খুলুন।</p>`;bind();
}

function view(g){
  const rows=g.list.map(x=>{
    const w=x.tests||x.days?`এই সপ্তাহে ${bn(x.days||0)} দিন, ${bn(x.tests||0)}টি পরীক্ষা`:'';
    return `<li><span class="n">${esc(x.nick)}${x.me?' (আপনি)':''}</span><span class="w">${w}</span>${x.live?'<span class="on">এখন পড়ছেন</span>':''}
      ${g.own&&!x.me?`<button class="kick" data-a="kick" data-m="${x.m}">বাদ দিন</button>`:''}</li>`}).join('');
  const others=g.list.filter(x=>x.live&&!x.me).length;
  const msgs=g.msgs.slice(0,12).map(m=>`<li><b>${esc(m.nick)}${m.me?' (আপনি)':''}:</b> ${esc(m.text)}<span class="t">${ago(m.ts)}</span></li>`).join('');
  $('app').innerHTML=`<h1>${esc(g.name)}</h1><p class="sub">পড়ার দল, ${bn(g.list.length)} জন (সর্বোচ্চ ${bn(g.max)})</p>
    ${others?`<p class="livel">এখন ${bn(others)} জন পড়ছেন। আপনিও শুরু করুন।</p><a class="btn" href="/exams/">পরীক্ষা দিন</a>`:''}
    <section class="part"><p class="lbl">এই সপ্তাহের কাজ</p><ol class="mem">${rows}</ol></section>
    <section class="part"><p class="lbl">দলে বার্তা পাঠান</p><div class="keys">${g.keys.map(k=>`<button data-a="msg" data-k="${k.k}">${esc(k.text)}</button>`).join('')}</div>
      <p class="sm mut" id="msg"></p>${msgs?`<ul class="msgs">${msgs}</ul>`:'<p class="sm mut">এখনো কোনো বার্তা নেই। বার্তা ৭ দিন পরে মুছে যায়।</p>'}</section>
    <section class="part"><p class="lbl">বন্ধু যোগ করুন</p>${g.list.length<g.max?'<button class="btn line" data-a="inv">বন্ধুকে দলের লিংক পাঠান</button>':'<p>দল ভরে গেছে।</p>'}
      ${g.own?'<button class="lnk" data-a="link">পুরোনো লিংক বাতিল করে নতুন লিংক</button>':''}<p class="sm mut" id="imsg"></p></section>
    <section class="part"><a href="/today/">"আজ" পাতা →</a><br><button class="lnk" data-a="leave">দল ছাড়ুন</button></section>`;
  bind();
}

let G=null;
function bind(){$('app').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b))}
async function act(a,el){
  if(a==='skip'){dropTok();return main()}
  if(a==='join'){el.disabled=true;const r=await post('join',{t:TOK});dropTok();if(!r.ok){el.disabled=false;return say(ERR[r.j.error]||'হয়নি। একটু পরে আবার চেষ্টা করুন।')}return main()}
  if(a==='new'){el.disabled=true;const r=await post('new',{name:$('nm').value});if(!r.ok){el.disabled=false;return say(ERR[r.j.error]||'হয়নি। একটু পরে আবার চেষ্টা করুন।')}return main()}
  if(a==='msg'){el.disabled=true;const r=await post('msg',{k:el.dataset.k});if(!r.ok){el.disabled=false;return say(ERR[r.j.error]||'যায়নি। একটু পরে আবার চেষ্টা করুন।')}return main()}
  if(a==='kick'){if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='নিশ্চিত?';return}await post('kick',{m:+el.dataset.m});return main()}
  if(a==='leave'){if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='নিশ্চিত? আবার চাপলে দল ছাড়বেন';return}await post('leave');return main()}
  if(a==='link'){if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='নিশ্চিত? আগে পাঠানো লিংক আর চলবে না';return}await post('link');return main()}
  if(a==='inv'){
    const link=location.origin+'/group/?t='+G.t,text='আমাদের পড়ার দল “'+G.name+'”-এ যোগ দাও। কে কত দিন পড়ল দেখা যায়, নম্বর নয়। লিয়ানা বুকসের সব পরীক্ষা ফ্রি।';
    const m=t=>{$('imsg').textContent=t};
    if(navigator.share){try{await navigator.share({title:'পড়ার দল',text,url:link});return m('লিংক পাঠানো হলো। বন্ধু লিংক খুলে লগইন করলেই যোগ দিতে পারবেন।')}catch(e){if(e&&e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(text+' '+link);m('লিংক কপি হলো। মেসেঞ্জার বা হোয়াটসঅ্যাপে পাঠান।')}catch(e){m('এই লিংক পাঠান: '+link)}
  }
}

async function main(){
  const u=window.LBA&&LBA.user();
  if(u)$('who').textContent=u.name||'';
  if(!u)return login();
  const r=await fetch('/api/grp',{credentials:'same-origin',cache:'no-store'}).catch(()=>null);
  if(r&&r.status===401){try{localStorage.removeItem('lb:u')}catch(e){}return login()}
  if(!r||!r.ok){$('app').innerHTML='<h1>পড়ার দল</h1><p class="wait">ইন্টারনেট নেই বা সার্ভার সাড়া দিচ্ছে না। একটু পরে পাতাটা আবার খুলুন।</p>';return}
  const j=await r.json();G=j.g;
  if(!G)return noGroup();
  if(TOK)dropTok();
  view(G);
}
main();
});
</script>
</body>
</html>
