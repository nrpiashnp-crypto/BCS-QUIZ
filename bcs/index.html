<script>
/* বিসিএস প্রিলি: home (exam list + subject sets) -> exam (timed) / practice. Hash routes, data fetched per exam. Engine shared in spirit with /jobs/. */
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const bnc=n=>bn(n.toLocaleString('en-IN'));
const K=['ক','খ','গ','ঘ','ঙ'];
const $=id=>document.getElementById(id);
const V=()=>$('view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=x=>bn(Number.isInteger(x)?x:(Math.round(x*100)/100).toString());
const sum=L=>L.reduce((a,e)=>a+e.n,0);
const BOOK='<a class="bl" href="/book/">লিয়ানা বুকস · ‘লিয়ানা বিসিএস বিজ্ঞান’ বইটি দেখুন →</a>';
let CATALOG=null;
const crumb=parts=>'<nav class="crumb"><a href="#/">বিসিএস প্রিলি</a>'+parts.map(([h,t])=>h?`<span><a href="${h}">${t}</a></span>`:`<span>${t}</span>`).join('')+'</nav>';
const nth=n=>bn(n)+'তম';
const subjects=()=>{const m={};CATALOG.sets.forEach(s=>{(m[s.k]=m[s.k]||{k:s.k,t:s.s,l:[]}).l.push(s)});return Object.values(m)};

function home(tab){
  const card=e=>{const m=e.title.match(/\(([^)]*)\)/);return `<a class="oc ex" href="#/x/${e.id}"><span class="nm">${nth(e.no)} ${e.special?'বিশেষ ':''}বিসিএস</span>${m?`<span class="tg">${m[1]}</span>`:''}</a>`};
  const L=CATALOG.exams,S=subjects();tab=tab||'x';
  V().innerHTML=`<section class="hero"><h1>বিসিএস প্রিলিমিনারি: ১০ম থেকে ৫০তম</h1>
  <div class="stats3"><span><b>${bn(L.length)}</b>টি পরীক্ষা</span><span><b>${bnc(sum(L))}</b>টি প্রশ্ন</span><span><b>${bn(S.length)}</b>টি বিষয়</span></div></section>
  <div class="chips tabs" id="tabs"><button type="button" class="chip" data-t="x" aria-pressed="${tab==='x'}">পরীক্ষা অনুযায়ী</button><button type="button" class="chip" data-t="s" aria-pressed="${tab==='s'}">বিষয় অনুযায়ী</button></div>
  <div id="tx"${tab==='x'?'':' hidden'}><div class="ogrid three">${L.filter(e=>e.no>=41).map(card).join('')}</div><details class="older"><summary>আরও পুরোনো বিসিএস (১০ম-৪০তম) দেখুন</summary><div class="ogrid three">${L.filter(e=>e.no<41).map(card).join('')}</div></details></div>
  <div id="ts"${tab==='s'?'':' hidden'}><p class="sub">একই বিষয়ের প্রশ্ন সব বিসিএস থেকে এক জায়গায়, নতুন পরীক্ষা আগে। প্রতিটি সেটে প্রায় ১০০টি প্রশ্ন।</p><div class="ogrid">${S.map(s=>`<a class="oc sj" href="#/s/${s.k}"><span class="nm">${s.t}</span></a>`).join('')}</div></div>`;
  $('tabs').onclick=ev=>{const b=ev.target.closest('.chip');if(!b)return;history.replaceState(null,'',b.dataset.t==='s'?'#/subjects':'#/');home(b.dataset.t)};
}
function subject(k){
  const s=subjects().find(x=>x.k===k);if(!s)return notFound();
  V().innerHTML=crumb([['#/subjects','বিষয় অনুযায়ী'],[null,s.t]])+`<h1>${s.t}</h1><p class="sub">১০ম থেকে ৫০তম বিসিএসের ${bnc(sum(s.l))}টি প্রশ্ন, ${bn(s.l.length)}টি সেটে।</p><div class="tlist">${s.l.map(x=>`<a class="tl" href="#/p/${x.id}"><span class="body"><span class="tt">সেট ${bn(x.part)}</span><span class="st">${x.from}${x.from!==x.to?' থেকে '+x.to:''} · ${bn(x.n)}টি প্রশ্ন</span></span><span class="gobtn">শুরু →</span></a>`).join('')}</div>`;
}
function notFound(){V().innerHTML=crumb([[null,'পাওয়া যায়নি']])+'<h1>পাতাটি পাওয়া যায়নি</h1><p><a href="#/">বিসিএস প্রিলির তালিকায় ফিরে যান</a></p>'}

// ---------- পরীক্ষা ----------
let E=null,Q=[],paper=[],pick=[],timer=null,endAt=0,startAt=0,armed=0,NEG=0.5,MIN=0;
const histKey=()=>'bcs-'+E.id;
function store(get,val){try{if(get)return JSON.parse(localStorage.getItem(histKey())||'[]');localStorage.setItem(histKey(),JSON.stringify(val))}catch(e){return []}}
async function exam(kind,id){
  let back,cr;
  if(kind==='x'){const e=CATALOG.exams.find(e=>e.id===id);if(!e)return notFound();
    E={id,title:e.title,full:1,time:e.time,file:'data/e/'+id+'.json'};back='#/';cr=[[null,e.title]]}
  else{const s=CATALOG.sets.find(s=>s.id===id);if(!s)return notFound();
    E={id:'s-'+id,title:`${s.s}: সেট ${bn(s.part)}`,time:Math.max(5,Math.round(s.n*0.6)),file:'data/s/'+id+'.json'};back='#/s/'+s.k;cr=[['#/subjects','বিষয় অনুযায়ী'],['#/s/'+s.k,s.s],[null,'সেট '+bn(s.part)]]}
  V().innerHTML='<p class="load">প্রশ্ন লোড হচ্ছে…</p>';
  try{Q=await (await fetch(E.file)).json()}catch(err){V().innerHTML='<p class="load">প্রশ্ন লোড হয়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p>';return}
  MIN=E.time;document.title=E.title+' · লিয়ানা বুকস';
  V().innerHTML=crumb(cr)+
  `<section id="start"><h1>${E.title}</h1>
   <p class="sub">${E.full?'আসল প্রশ্নপত্র':'বিষয়ভিত্তিক সেট'} · ${bn(Q.length)}টি প্রশ্ন</p>
   <div class="btns start"><button class="btn" id="go" type="button">পরীক্ষা শুরু করুন →</button><button class="btn ghost" id="practice" type="button">অনুশীলন (সঙ্গে সঙ্গে উত্তর)</button></div>
   <div class="facts"><div class="fact"><b>${bn(Q.length)}</b><span>প্রশ্ন</span></div><div class="fact"><b>${bn(MIN)}</b><span>মিনিট</span></div></div><b id="negt" hidden></b>
   <p class="lbl">নেগেটিভ মার্কিং</p><div class="chips" id="negc"><button type="button" class="chip" data-v="0.5" aria-pressed="true">−০.৫</button><button type="button" class="chip" data-v="0.25" aria-pressed="false">−০.২৫</button><button type="button" class="chip" data-v="0" aria-pressed="false">নেই</button></div>
   <div class="hist" id="hist" hidden></div></section>
  <section id="exam" hidden><div class="bar"><span class="clock" id="clock"></span><span>উত্তর <b id="ans">০</b> / <b>${bn(Q.length)}</b></span><button class="btn" id="submit" type="button">জমা দিন</button></div><main id="elist"></main><div class="btns"><button class="btn" id="submit2" type="button">জমা দিন</button></div></section>
  <section id="result" hidden><div class="score" id="scorebox"></div><div id="weak"></div><div class="btns"><button class="btn" id="again" type="button">আবার পরীক্ষা দিন</button><a class="btn ghost" href="${back}">অন্য পরীক্ষা</a></div><h2>উত্তর ও ব্যাখ্যা</h2><main id="rlist"></main></section>
  <section id="prac" hidden><div class="bar"><span>সঠিক <b id="pok">০</b> / উত্তর <b id="pdone">০</b> / মোট <b id="ptot">০</b></span><button class="btn ghost" id="back" type="button">শুরুর পাতা</button></div><div class="chips" id="chips"></div><main id="plist"></main></section>`;
  NEG=0.5;setNeg(NEG);
  $('negc').onclick=ev=>{const v=ev.target.dataset&&ev.target.dataset.v;if(v===undefined)return;setNeg(parseFloat(v))};
  $('go').onclick=$('again').onclick=startExam;
  $('submit').onclick=$('submit2').onclick=askSubmit;
  $('practice').onclick=()=>{renderPrac('all');show('prac')};
  $('back').onclick=()=>{show('start');drawHist()};
  drawHist();window.scrollTo(0,0);
}
function setNeg(v){NEG=v;[...$('negc').children].forEach(c=>c.setAttribute('aria-pressed',parseFloat(c.dataset.v)===v));$('negt').textContent=v?'−'+bn(v):'০ (নেগেটিভ নেই)'}
const show=id=>{['start','exam','result','prac'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)};
const qhtml=(q,i)=>`<div class="qh"><span class="num">${bn(i+1)}.</span><div class="qt">${q.q}<span class="src">${esc(q.s||'')}${q.x?' · '+esc(q.x):''}</span></div></div>`;
function drawHist(){
  const h=store(true)||[],el=$('hist');if(!h.length){el.hidden=true;return}
  el.hidden=false;el.innerHTML='<b>এই ফোনে আগের ফল</b><table><tr><th>তারিখ</th><th>নম্বর</th><th>নেগেটিভ</th></tr>'+h.slice(-8).map(r=>`<tr><td>${r.d}</td><td>${fmt(r.s)} / ${bn(r.n)}</td><td>${r.g?'−'+bn(r.g):'নেই'}</td></tr>`).join('')+'</table>';
}
function startExam(){
  paper=Q.map((q,i)=>i); pick=paper.map(()=>-1);
  const box=$('elist');box.innerHTML='';
  paper.forEach((qi,i)=>{const q=Q[qi];
    const s=document.createElement('section');s.className='q';s.innerHTML=qhtml(q,i)+'<div class="opts"></div>';
    const o=s.querySelector('.opts');
    q.o.forEach((t,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=`<span class="k">${K[j]}</span><span>${t}</span>`;
      b.onclick=()=>{pick[i]=pick[i]===j?-1:j;[...o.children].forEach(x=>x.classList.toggle('sel',x===b&&pick[i]===j));$('ans').textContent=bn(pick.filter(x=>x>=0).length)};o.appendChild(b)});
    box.appendChild(s)});
  $('ans').textContent='০';startAt=Date.now();endAt=startAt+MIN*60000;tick();clearInterval(timer);timer=setInterval(tick,500);show('exam');
}
function tick(){const left=Math.max(0,endAt-Date.now()),s=Math.ceil(left/1000);
  $('clock').textContent=bn(String(Math.floor(s/60)).padStart(2,'0'))+':'+bn(String(s%60).padStart(2,'0'));$('clock').classList.toggle('low',s<=60);if(left<=0)finish()}
function askSubmit(){
  const blank=pick.filter(x=>x<0).length;
  if(armed&&Date.now()-armed<4000){finish();return}
  armed=Date.now();[$('submit'),$('submit2')].forEach(b=>b.textContent=blank?`${bn(blank)}টি বাকি, তবু জমা দিতে আবার চাপুন`:'নিশ্চিত হলে আবার চাপুন');
  setTimeout(()=>{if(Date.now()-armed>=4000)[$('submit'),$('submit2')].forEach(b=>b.textContent='জমা দিন')},4100);
}
function finish(){
  clearInterval(timer);timer=null;armed=0;
  let ok=0,bad=0;const bys={};
  paper.forEach((qi,i)=>{const q=Q[qi],k=q.s||'অন্যান্য';bys[k]=bys[k]||[0,0,0];bys[k][2]++;if(pick[i]<0)return;if(pick[i]===q.a){ok++;bys[k][0]++}else{bad++;bys[k][1]++}});
  const n=paper.length,blank=n-ok-bad,score=ok-bad*NEG,used=Math.min(MIN*60,Math.round((Date.now()-startAt)/1000));
  const d=new Date(),ds=bn(d.getDate())+'/'+bn(d.getMonth()+1)+'/'+bn(d.getFullYear());
  const h=store(true)||[];h.push({d:ds,s:score,n,g:NEG});store(false,h);window.LBA&&LBA.save({k:histKey()+'#'+(h.length-1),c:'bcs',t:E.title,s:score,n,ok,no:bad,sec:used,sb:Object.fromEntries(Object.entries(bys).map(([k,v])=>[k,[v[0],v[2]]]))});
  const pc=score/n;
  $('scorebox').innerHTML=`<div class="big">${fmt(score)} / ${bn(n)}</div>
   <div class="stats"><span class="ok">সঠিক ${bn(ok)}</span><span class="no">ভুল ${bn(bad)}</span><span class="skip">উত্তর দেননি ${bn(blank)}</span><span>সময় ${bn(Math.floor(used/60))} মিনিট ${bn(used%60)} সেকেন্ড</span></div>
   ${Object.keys(bys).length>1?`<div class="sbg">${Object.entries(bys).map(([k,v])=>`<div class="sb${v[0]/v[2]<.5?' low':''}"><span>${esc(k)}</span><b>${bn(v[0])}/${bn(v[2])}</b><span class="mb"><i style="width:${Math.round(v[0]*100/v[2])}%"></i></span></div>`).join('')}</div>`:''}`;
  // weak = subject under 60% correct with at least 3 questions, weakest first
  const weak=Object.entries(bys).map(([t,v])=>({t,ok:v[0],n:v[2],r:v[0]/v[2]})).filter(r=>r.n>=3&&r.r<.6).sort((a,b)=>a.r-b.r||b.n-a.n).slice(0,4);
  const wbox=Object.keys(bys).length>1?`<div class="wk"><h2>দুর্বল জায়গা</h2>${weak.length?`<ul class="wl">${weak.map(r=>`<li><b>${esc(r.t)}</b> <span class="wn">${bn(r.ok)}/${bn(r.n)} সঠিক</span></li>`).join('')}</ul>`:'<p class="wtip">কোনো বিষয়ে বড় দুর্বলতা নেই। চমৎকার!</p>'}</div>`:'';
  const tip=[];
  if(weak.length)tip.push(`নিচের ব্যাখ্যায় আগে <b>${esc(weak[0].t)}</b>${weak[1]?' ও <b>'+esc(weak[1].t)+'</b>':''}-এর ভুলগুলো পড়ুন, তারপর "বিষয় অনুযায়ী" অংশ থেকে ওই বিষয়ের একটি সেট দিন।`);
  if(NEG&&bad>=Math.max(3,ok*.4))tip.push(`ভুলের জন্য ${fmt(bad*NEG)} নম্বর কাটা গেছে। পুরো নিশ্চিত না হলে, অন্তত দুটি অপশন বাদ দিতে না পারলে উত্তর ছেড়ে দিন।`);
  if(blank>=Math.max(4,n*.2))tip.push(used>=MIN*60-5?`সময় শেষ হয়ে ${bn(blank)}টি প্রশ্ন বাকি ছিল। যেটা জানেন সেটা আগে করুন, কঠিন প্রশ্নে আটকে থাকবেন না।`:`${bn(blank)}টি প্রশ্ন ছেড়ে দিয়েছেন। এগুলোর ব্যাখ্যা পড়ে নিন, বিসিএসে একই ধরনের প্রশ্ন বারবার আসে।`);
  if(!tip.length)tip.push(pc>=.7?'চমৎকার ফল! ভুল কয়েকটির ব্যাখ্যা দেখে আরেকটি পরীক্ষা দিন।':'ভুল ও ছেড়ে দেওয়া প্রশ্নগুলোর ব্যাখ্যা মন দিয়ে পড়ুন, তারপর আরেকটি পরীক্ষা দিন।');
  $('weak').innerHTML=wbox+`<div class="wk tipbox"><h2>এখন কী করবেন</h2><ul>${tip.slice(0,3).map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  const box=$('rlist');box.innerHTML='';
  paper.forEach((qi,i)=>{const q=Q[qi],p=pick[i];
    const s=document.createElement('section');s.className='q';
    s.innerHTML=qhtml(q,i)+`<div class="opts">${q.o.map((t,j)=>`<button type="button" class="opt${j===q.a?' right':''}${j===p&&p!==q.a?' wrong':''}" disabled><span class="k">${K[j]}</span><span>${t}</span></button>`).join('')}</div>
     <div class="exp">${p<0?'<span class="skip">উত্তর দেননি।</span> সঠিক উত্তর: '+K[q.a]+'।':p===q.a?'<span class="ok">সঠিক (+১)।</span>':'<span class="no">ভুল ('+(NEG?'−'+bn(NEG):'০')+')।</span> সঠিক উত্তর: '+K[q.a]+'।'} ${q.e||''}${BOOK}</div>`;
    box.appendChild(s)});
  window.LBX={file:new URL(E.file,location.href).pathname,idx:paper.slice(),picks:pick.slice()};
  show('result');drawHist();
}
function renderPrac(f){
  const subs=[...new Set(Q.map(q=>q.s).filter(Boolean))];
  $('chips').innerHTML=subs.length>1?[['all','সব'],...subs.map(s=>[s,s])].map(([k,t])=>`<button type="button" class="chip" data-k="${esc(k)}" aria-pressed="${k===f}">${esc(t)}</button>`).join(''):'';
  $('chips').onclick=ev=>{const k=ev.target.dataset&&ev.target.dataset.k;if(k)renderPrac(k)};
  const L=Q.filter(q=>f==='all'||q.s===f);let ok=0,done=0;
  const upd=()=>{$('pok').textContent=bn(ok);$('pdone').textContent=bn(done);$('ptot').textContent=bn(L.length)};
  const box=$('plist');box.innerHTML='';
  L.forEach((q,i)=>{const s=document.createElement('section');s.className='q';s.innerHTML=qhtml(q,i)+'<div class="opts"></div>';
    const o=s.querySelector('.opts');
    q.o.forEach((t,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=`<span class="k">${K[j]}</span><span>${t}</span>`;
      b.onclick=()=>{[...o.children].forEach(x=>x.disabled=true);o.children[q.a].classList.add('right');const g=j===q.a;if(!g)b.classList.add('wrong');done++;if(g)ok++;upd();
        const e=document.createElement('div');e.className='exp';e.innerHTML=`<span class="${g?'ok':'no'}">${g?'সঠিক।':'ভুল। সঠিক উত্তর: '+K[q.a]+'।'}</span> ${q.e||''}${BOOK}`;s.appendChild(e)};o.appendChild(b)});
    box.appendChild(s)});
  upd();
}

// ---------- রাউটার ----------
function route(){
  if(timer){clearInterval(timer);timer=null}
  document.title='বিসিএস প্রিলি প্রশ্নব্যাংক · লিয়ানা বুকস';
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(!p.length)return home('x');
  if(p[0]==='subjects')return home('s');
  if(p[0]==='x'||p[0]==='p')return exam(p[0],p[1]);
  if(p[0]==='s')return subject(p[1]);
  notFound();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
window.addEventListener('beforeunload',e=>{if($('exam')&&!$('exam').hidden){e.preventDefault();e.returnValue=''}});
fetch('data/catalog.json').then(r=>r.json()).then(c=>{CATALOG=c;route()}).catch(()=>{V().innerHTML='<p class="load">তালিকা লোড হয়নি। আবার চেষ্টা করুন।</p>'});
</script>
