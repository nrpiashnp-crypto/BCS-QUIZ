<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13294b">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>চাকরির বিজ্ঞপ্তি তোলা · লিয়ানা বুকস</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo/final-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--paper:#f8f5ee;--ink:#1d1f21;--muted:#5d5a55;--rule:#e6d3d9;--card:#fffdf7;--navy:#13294b;--pink:#c8326a;--good:#1e7a46;--bad:#b3261e;--warn:#8a5a00;--body:'Noto Sans Bengali',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
h2{font-size:17px;margin:22px 0 8px;font-weight:600}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 12px}
.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:3px;padding:10px 16px;font:600 15px/1.3 var(--body);cursor:pointer}
.btn.line{background:var(--card)!important;color:var(--navy)!important;border:1.4px solid var(--pink)}
.lnk{background:none;border:0;padding:4px 0;font:inherit;font-size:14.5px;color:var(--navy);text-decoration:underline;cursor:pointer}
.box{background:var(--card);border:1.4px solid rgba(200,50,106,.45);border-radius:3px;padding:12px 14px}
fieldset{border:0;padding:0;margin:0}
label{display:block;font-weight:600;font-size:14.5px;margin:12px 0 3px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:16px var(--body);padding:9px 8px;border:1px solid #cfc8bb;border-radius:3px;background:#fff;color:var(--ink);min-height:42px}
textarea{min-height:64px}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.ck{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px}
.ck label{display:flex;align-items:center;gap:6px;font-weight:400;margin:0;min-height:34px}
.ck input{width:18px;height:18px;min-height:0;margin:0;accent-color:#13294b}
.hint{font-size:13px;color:var(--muted);margin:3px 0 0}
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.msg{font-size:15px;margin:10px 0 0}.msg.ok{color:var(--good)}.msg.err{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td{padding:7px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
tr.pick{cursor:pointer}tr.pick:hover{background:#f4ede3}
.st{font-size:13px;padding:1px 6px;border-radius:3px;border:1px solid var(--rule);white-space:nowrap}
.st.live{color:var(--good);border-color:var(--good)}.st.off{color:var(--muted)}
.st.draft{color:var(--warn);border-color:var(--warn)}
</style>
<link rel="stylesheet" href="/css/omr.css">
</head>
<body>
<div class="sitebar"><a href="/" aria-label="লিয়ানা বুকস"><img src="/img/logo/li-mark.svg" alt="" width="34" height="44"><span class="lgn-n">লিয়ানা বুকস</span></a><a href="/myjobs/" style="font-size:15px">আমার চাকরি</a></div>
<main class="wrap" id="app"><p class="sub">খোলা হচ্ছে…</p></main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES={g9:'৯ম গ্রেড',g10:'১০ম গ্রেড',bcs:'বিসিএস',gbank:'সরকারি ব্যাংক',pbank:'বেসরকারি ব্যাংক',gov:'অন্যান্য সরকারি'};
const EDU={ssc:'এসএসসি',hsc:'এইচএসসি',diploma:'ডিপ্লোমা',hons:'স্নাতক',masters:'স্নাতকোত্তর'};
const GRP={sci:'বিজ্ঞান',arts:'মানবিক',com:'ব্যবসায় শিক্ষা',eng:'প্রকৌশল',med:'চিকিৎসা',other:'অন্যান্য'};
const ST={draft:'খসড়া',live:'চালু',off:'বন্ধ'};
const api=(p,b)=>fetch('/api/'+p,b?{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{credentials:'same-origin',cache:'no-store'}).then(r=>r.json().then(j=>r.ok?j:Promise.reject(j)));
let ALL=[],cur=null;
const newId=()=>'j-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6);
const opt=(o,sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${v}</option>`).join('');
const F=(id,lab,val,type,hint,extra)=>`<div><label for="${id}">${lab}</label><input id="${id}" type="${type||'text'}" value="${esc(val==null?'':val)}"${extra||''}>${hint?`<p class="hint">${hint}</p>`:''}</div>`;

function listView(){
  const rows=ALL.map((j,i)=>`<tr class="pick" data-i="${i}"><td><b>${esc(j.post)}</b><br><span class="hint">${esc(j.org)} · ${TYPES[j.type]||''}</span></td><td>${esc(j.ae||'')}</td><td><span class="st ${j.st}">${ST[j.st]}</span>${j.st==='live'&&j.ae&&j.ae<new Date(Date.now()+216e5).toISOString().slice(0,10)?'<br><span class="hint">মেয়াদ শেষ</span>':''}</td></tr>`).join('');
  $('app').innerHTML=`<h1>চাকরির বিজ্ঞপ্তি</h1><p class="sub">প্রতিটা পদ এক সারি। "চালু" করলে /myjobs/-এ দেখায়, শেষ তারিখ পার হলে নিজেই সরে যায়।</p>
  <button class="btn" id="add">নতুন পদ যোগ</button>
  <h2>তোলা পদ: ${ALL.length}টা</h2>
  ${ALL.length?`<table>${rows}</table>`:'<p class="sub">এখনো কিছু তোলা হয়নি।</p>'}
  <div class="box" style="margin-top:20px"><b>ব্যাকআপ</b><p class="hint" style="margin:4px 0 8px">এই তথ্যের আলাদা ব্যাকআপ নেই। কয়েকটা তোলার পরে নিচের বোতামে চেপে কপি করুন আর Claude-কে দিন; Lyanna_data-তে রেখে দেবে।</p><button class="btn line" id="cp">সব তথ্য কপি করুন</button><p class="msg" id="cpm"></p></div>`;
  $('add').onclick=()=>edit(null);
  document.querySelectorAll('tr.pick').forEach(t=>t.onclick=()=>edit(ALL[+t.dataset.i]));
  $('cp').onclick=async()=>{const txt=JSON.stringify({ts:new Date().toISOString(),jobs:ALL},null,1);
    try{await navigator.clipboard.writeText(txt);$('cpm').textContent='কপি হয়েছে ('+ALL.length+'টা পদ)।';$('cpm').className='msg ok'}
    catch(e){$('cpm').innerHTML='<textarea style="min-height:140px">'+esc(txt)+'</textarea>';$('cpm').className='msg'}};
}

function edit(j,copy){
  cur=copy?{...copy,id:newId(),post:'',seats:null,st:'draft'}:j?{...j}:{id:newId(),st:'draft',grp:[],subj:[]};const c=cur;
  $('app').innerHTML=`<button class="lnk" id="bk">← তালিকা</button><h1>${j?'পদ বদলান':'নতুন পদ'}</h1>
  <p class="sub">মূল বিজ্ঞপ্তি দেখে পূরণ করুন। যা বিজ্ঞপ্তিতে নেই, ফাঁকা রাখুন; আন্দাজ নয়। এক বিজ্ঞপ্তিতে কয়েকটা পদ থাকলে প্রতিটা আলাদা যোগ করুন (নিচে "এর মতো আরেকটা")।</p>
  <form id="jf" novalidate>
  <div><label for="ty">ধরন</label><select id="ty">${opt(TYPES,c.type,'বাছুন')}</select></div>
  ${F('po','পদের নাম',c.post)}
  ${F('or','প্রতিষ্ঠান',c.org,'','যেমন: বাংলাদেশ ব্যাংক; সমন্বিত হলে "সমন্বিত ৮ ব্যাংক"')}
  <div class="two">${F('gr','গ্রেড',c.grade,'number','','inputmode="numeric"')}${F('se','পদসংখ্যা',c.seats,'number','','inputmode="numeric"')}</div>
  <h2>তারিখ</h2>
  <div class="two">${F('nd','বিজ্ঞপ্তির তারিখ',c.nd,'date')}${F('as','আবেদন শুরু',c.as,'date')}</div>
  <div class="two">${F('ae','আবেদনের শেষ তারিখ',c.ae,'date')}${F('at','শেষ সময়',c.at,'','যেমন: বিকেল ৫টা')}</div>
  <h2>বয়স</h2>
  <div class="two">${F('amin','সর্বনিম্ন বয়স',c.amin,'number','','inputmode="numeric"')}${F('amax','সর্বোচ্চ বয়স',c.amax,'number','সাধারণ প্রার্থীর','inputmode="numeric"')}</div>
  ${F('aref','বয়স গোনার তারিখ',c.aref,'date','বিজ্ঞপ্তিতে যে তারিখ ধরে বয়স গুনতে বলা হয়েছে')}
  <h2>যোগ্যতা</h2>
  <div><label for="ed">সর্বনিম্ন পাস</label><select id="ed">${opt(EDU,c.edu,'বলা নেই')}</select></div>
  ${F('edut','পাসের খুঁটিনাটি',c.edut,'','যেমন: যেকোনো বিষয়ে স্নাতক; বা ইংরেজিতে স্নাতক')}
  <label>শুধু এই বিভাগের জন্য <small>(কিছু না দাগালে সবার জন্য)</small></label>
  <div class="ck">${Object.entries(GRP).map(([k,v])=>`<label><input type="checkbox" name="gp" value="${k}"${(c.grp||[]).includes(k)?' checked':''}>${v}</label>`).join('')}</div>
  <label>তৃতীয় বিভাগ/শ্রেণি</label>
  <div class="ck"><label><input type="radio" name="th" value="0"${c.third===0?' checked':''}>চলবে না</label><label><input type="radio" name="th" value=""${c.third!==0?' checked':''}>বলা নেই / চলবে</label></div>
  <div><label for="ot">অন্য শর্ত <small>(যা সাইট মেলাতে পারে না)</small></label><textarea id="ot">${esc(c.other||'')}</textarea><p class="hint">যেমন: ২ বছরের অভিজ্ঞতা; নির্দিষ্ট জেলা; উচ্চতা। থাকলে প্রার্থী পদটা "নিজে মিলিয়ে নিতে হবে" ভাঁজে দেখবেন।</p></div>
  <h2>ফি, পরীক্ষা, করণীয়</h2>
  ${F('fe','ফি',c.fee,'','যেমন: ২০০ টাকা')}
  ${F('ft','ফি জমার নিয়ম',c.feet,'','যেমন: আবেদনের ৭২ ঘণ্টার মধ্যে টেলিটক দিয়ে')}
  ${F('ad','প্রবেশপত্র',c.admit,'','জানা থাকলে; না থাকলে ফাঁকা')}
  <div class="two">${F('ex','পরীক্ষার মাস বা তারিখ',c.exam,'','যেমন 2026-12 বা 2026-12-20')}<div><label>তারিখটা</label><div class="ck"><label><input type="checkbox" id="es"${c.est?' checked':''}>আনুমানিক</label></div></div></div>
  ${F('sj','পরীক্ষার বিষয়',(c.subj||[]).join(', '),'','কমা দিয়ে: বাংলা, ইংরেজি, গণিত, সাধারণ জ্ঞান')}
  <h2>লিংক</h2>
  ${F('ur','আবেদনের সাইট',c.url,'url')}
  ${F('sr','মূল বিজ্ঞপ্তির লিংক',c.src,'url')}
  ${F('sn','বিজ্ঞপ্তি কার',c.srcn,'','যেমন: বাংলাদেশ ব্যাংকের বিজ্ঞপ্তি')}
  ${F('co','কোর্সের পাতা',c.course,'','সাইটের পথ, যেমন /running/petrobangla/; না থাকলে ফাঁকা')}
  <div><label for="st">অবস্থা</label><select id="st">${opt(ST,c.st)}</select></div>
  <p class="msg" id="fm"></p>
  <div class="bar2"><button class="btn">রাখুন</button>${j?'<button type="button" class="btn line" id="dup">এর মতো আরেকটা</button><button type="button" class="lnk" id="dl">মুছুন</button>':''}</div>
  </form>`;
  $('bk').onclick=load;
  $('jf').onsubmit=async e=>{e.preventDefault();
    const v=id=>$(id).value.trim(),th=document.querySelector('input[name=th]:checked');
    const job={id:c.id,type:v('ty'),post:v('po'),org:v('or'),grade:v('gr'),seats:v('se'),nd:v('nd'),as:v('as'),ae:v('ae'),at:v('at'),amin:v('amin'),amax:v('amax'),aref:v('aref'),
      edu:v('ed'),edut:v('edut'),grp:[...document.querySelectorAll('input[name=gp]:checked')].map(x=>x.value),third:th&&th.value==='0'?0:null,other:v('ot'),
      fee:v('fe'),feet:v('ft'),admit:v('ad'),exam:v('ex'),est:$('es').checked?1:0,subj:v('sj').split(/[,،]/).map(s=>s.trim()).filter(Boolean),url:v('ur'),src:v('sr'),srcn:v('sn'),course:v('co')};
    const fm=$('fm'),st=v('st'),miss=[];
    if(!job.type)miss.push('ধরন');if(!job.post)miss.push('পদের নাম');if(!job.org)miss.push('প্রতিষ্ঠান');
    if(st==='live'){if(!job.ae)miss.push('শেষ তারিখ');if(!job.src)miss.push('মূল বিজ্ঞপ্তির লিংক')}
    if(job.amax&&!job.aref)miss.push('বয়স গোনার তারিখ');
    if(miss.length){fm.textContent='বাকি: '+miss.join(', ');fm.className='msg err';return}
    try{await api('admin/jobs',{job,st});fm.textContent='রাখা হয়েছে।';fm.className='msg ok';await fetchAll();const nj=ALL.find(x=>x.id===c.id);if(!j&&nj)edit(nj),$('fm').textContent='রাখা হয়েছে।',$('fm').className='msg ok'}
    catch(err){fm.textContent='রাখা যায়নি: '+(err&&err.error||'নেট দেখুন');fm.className='msg err'}};
  if(j){
    $('dup').onclick=()=>edit(null,cur);
    $('dl').onclick=async function(){if(!this.dataset.sure){this.dataset.sure=1;this.textContent='নিশ্চিত? আবার চাপুন';return}
      try{await api('admin/jobs/del',{id:c.id});load()}catch(e){}};
  }
}
async function fetchAll(){ALL=(await api('admin/jobs')).jobs}
async function load(){
  try{await fetchAll();listView()}
  catch(e){$('app').innerHTML=e&&e.error==='login'?'<p>আগে <a href="/account/">লগইন</a> করুন।</p>':e&&e.error==='admin'?'<p>এই পাতা শুধু অ্যাডমিনের।</p>':'<p>খোলা যায়নি। নেট দেখে আবার খুলুন।</p>'}
}
load();
})();
</script>
<script src="/js/omr.js" defer></script>
</body>
</html>
