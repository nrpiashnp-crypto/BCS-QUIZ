<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13294b">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Job circulars · Lyanna Books</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo/final-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--paper:#f8f5ee;--ink:#1d1f21;--muted:#5d5a55;--rule:#e6d3d9;--card:#fffdf7;--navy:#13294b;--pink:#c8326a;--good:#1e7a46;--bad:#b3261e;--warn:#8a5a00;--body:'Noto Sans Bengali',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--navy)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
h2{font-size:17px;margin:22px 0 8px;font-weight:600}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 12px}
.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:3px;padding:10px 16px;font:600 15px/1.3 var(--body);cursor:pointer}
.btn.line{background:var(--card)!important;color:var(--navy)!important;border:1.4px solid var(--pink)}
.lnk{background:none;border:0;padding:4px 0;font:inherit;font-size:14.5px;color:var(--navy);text-decoration:underline;cursor:pointer}
.box{background:var(--card);border:1.4px solid rgba(200,50,106,.45);border-radius:3px;padding:12px 14px}
fieldset{border:0;padding:0;margin:0}
label{display:block;font-weight:600;font-size:14.5px;margin:12px 0 3px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:16px var(--body);padding:9px 8px;border:1px solid #cfc8bb;border-radius:3px;background:#fff;color:var(--ink);min-height:42px}
textarea{min-height:64px}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.ck{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px}
.ck label{display:flex;align-items:center;gap:6px;font-weight:400;margin:0;min-height:34px}
.ck input{width:18px;height:18px;min-height:0;margin:0;accent-color:#13294b}
.hint{font-size:13px;color:var(--muted);margin:3px 0 0}
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.msg{font-size:15px;margin:10px 0 0}.msg.ok{color:var(--good)}.msg.err{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td{padding:7px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
tr.pick{cursor:pointer}tr.pick:hover{background:#f4ede3}
.st{font-size:13px;padding:1px 6px;border-radius:3px;border:1px solid var(--rule);white-space:nowrap}
.st.live{color:var(--good);border-color:var(--good)}.st.off{color:var(--muted)}
.st.draft{color:var(--warn);border-color:var(--warn)}
</style>
<link rel="stylesheet" href="/css/omr.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="adbar"><a class="adback" href="/admin/">← Admin</a><span class="adname">Job circulars</span><a class="adwho" href="/myjobs/" style="color:#cfd6e2">My jobs page</a></div>
<main class="wrap" id="app"><p class="sub">Opening…</p></main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES={g9:'Grade 9',g10:'Grade 10',bcs:'BCS',gbank:'Government bank',pbank:'Private bank',gov:'Other government'};
const EDU={ssc:'SSC',hsc:'HSC',diploma:'Diploma',hons:'Bachelor\'s',masters:'Master\'s'};
const GRP={sci:'Science',arts:'Humanities',com:'Business studies',eng:'Engineering',med:'Medical',other:'Other'};
const ST={draft:'Draft',live:'Live',off:'Closed'};
const api=(p,b)=>fetch('/api/'+p,b?{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{credentials:'same-origin',cache:'no-store'}).then(r=>r.json().then(j=>r.ok?j:Promise.reject(j)));
let ALL=[],cur=null;
const newId=()=>'j-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6);
const opt=(o,sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${v}</option>`).join('');
const F=(id,lab,val,type,hint,extra)=>`<div><label for="${id}">${lab}</label><input id="${id}" type="${type||'text'}" value="${esc(val==null?'':val)}"${extra||''}>${hint?`<p class="hint">${hint}</p>`:''}</div>`;

function listView(){
  const rows=ALL.map((j,i)=>`<tr class="pick" data-i="${i}"><td><b>${esc(j.post)}</b><br><span class="hint">${esc(j.org)} · ${TYPES[j.type]||''}</span></td><td>${esc(j.ae||'')}</td><td><span class="st ${j.st}">${ST[j.st]}</span>${j.st==='live'&&j.ae&&j.ae<new Date(Date.now()+216e5).toISOString().slice(0,10)?'<br><span class="hint">Expired</span>':''}</td></tr>`).join('');
  $('app').innerHTML=`<h1>Job circulars</h1><p class="sub">One row per post. "Live" posts show on /myjobs/ and drop off by themselves after the deadline.</p>
  <button class="btn" id="add">Add new post</button>
  <h2>Posts added: ${ALL.length}</h2>
  ${ALL.length?`<table>${rows}</table>`:'<p class="sub">Nothing added yet.</p>'}
  <div class="box" style="margin-top:20px"><b>Backup</b><p class="hint" style="margin:4px 0 8px">This data has no separate backup. After adding a few posts, tap the button below, copy, and give it to Claude to save in Lyanna_data.</p><button class="btn line" id="cp">Copy all data</button><p class="msg" id="cpm"></p></div>`;
  $('add').onclick=()=>edit(null);
  document.querySelectorAll('tr.pick').forEach(t=>t.onclick=()=>edit(ALL[+t.dataset.i]));
  $('cp').onclick=async()=>{const txt=JSON.stringify({ts:new Date().toISOString(),jobs:ALL},null,1);
    try{await navigator.clipboard.writeText(txt);$('cpm').textContent='Copied ('+ALL.length+' posts).';$('cpm').className='msg ok'}
    catch(e){$('cpm').innerHTML='<textarea style="min-height:140px">'+esc(txt)+'</textarea>';$('cpm').className='msg'}};
}

let PUSHED=0;
// পদের ফর্ম খুললে ঠিকানায় #edit জমা হয়, তাই ফোনের ব্যাক চাপলে তালিকায় ফেরে
function toList(){if(PUSHED&&location.hash==='#edit'){PUSHED--;history.back()}else load()}
addEventListener('popstate',()=>{if(location.hash!=='#edit')load()});
function edit(j,copy){if(location.hash!=='#edit'){history.pushState(null,'','#edit');PUSHED++}
  cur=copy?{...copy,id:newId(),post:'',seats:null,st:'draft'}:j?{...j}:{id:newId(),st:'draft',grp:[],subj:[]};const c=cur;
  $('app').innerHTML=`<button class="lnk" id="bk">← List</button><h1>${j?'Edit post':'New post'}</h1>
  <p class="sub">Fill in from the original circular. Leave blank what the circular does not say; do not guess. If one circular has several posts, add each separately (use "Duplicate" below).</p>
  <form id="jf" novalidate>
  <div><label for="ty">Type</label><select id="ty">${opt(TYPES,c.type,'Choose')}</select></div>
  ${F('po','Post name',c.post)}
  ${F('or','Organisation',c.org,'','e.g. বাংলাদেশ ব্যাংক; for a joint circular, "সমন্বিত ৮ ব্যাংক"')}
  <div class="two">${F('gr','Grade',c.grade,'number','','inputmode="numeric"')}${F('se','Number of seats',c.seats,'number','','inputmode="numeric"')}</div>
  <h2>Dates</h2>
  <div class="two">${F('nd','Circular date',c.nd,'date')}${F('as','Application opens',c.as,'date')}</div>
  <div class="two">${F('ae','Application deadline',c.ae,'date')}${F('at','Deadline time',c.at,'','e.g. বিকেল ৫টা (5 PM)')}</div>
  <h2>Age</h2>
  <div class="two">${F('amin','Minimum age',c.amin,'number','','inputmode="numeric"')}${F('amax','Maximum age',c.amax,'number','For general candidates','inputmode="numeric"')}</div>
  ${F('aref','Age cut-off date',c.aref,'date','The date the circular says age is counted on')}
  <h2>Eligibility</h2>
  <div><label for="ed">Minimum qualification</label><select id="ed">${opt(EDU,c.edu,'Not stated')}</select></div>
  ${F('edut','Qualification details',c.edut,'','e.g. যেকোনো বিষয়ে স্নাতক; বা ইংরেজিতে স্নাতক (bachelor\'s in any subject; or in English)')}
  <label>Only for these groups <small>(tick none for everyone)</small></label>
  <div class="ck">${Object.entries(GRP).map(([k,v])=>`<label><input type="checkbox" name="gp" value="${k}"${(c.grp||[]).includes(k)?' checked':''}>${v}</label>`).join('')}</div>
  <label>Third division/class</label>
  <div class="ck"><label><input type="radio" name="th" value="0"${c.third===0?' checked':''}>Not accepted</label><label><input type="radio" name="th" value=""${c.third!==0?' checked':''}>Not stated / accepted</label></div>
  <div><label for="ot">Other conditions <small>(that the site cannot match)</small></label><textarea id="ot">${esc(c.other||'')}</textarea><p class="hint">e.g. 2 years of experience; a specific district; height. If filled, the learner sees the post under "Check yourself".</p></div>
  <h2>Fee, exam, to-do</h2>
  ${F('fe','Fee',c.fee,'','e.g. ২০০ টাকা')}
  ${F('ft','How to pay the fee',c.feet,'','e.g. আবেদনের ৭২ ঘণ্টার মধ্যে টেলিটক দিয়ে')}
  ${F('ad','Admit card',c.admit,'','If known; otherwise leave blank')}
  <div class="two">${F('ex','Exam month or date',c.exam,'','e.g. 2026-12 or 2026-12-20')}<div><label>The date is</label><div class="ck"><label><input type="checkbox" id="es"${c.est?' checked':''}>Approximate</label></div></div></div>
  ${F('sj','Exam subjects',(c.subj||[]).join(', '),'','Comma-separated, e.g. বাংলা, ইংরেজি, গণিত, সাধারণ জ্ঞান')}
  <h2>Links</h2>
  ${F('ur','Application site',c.url,'url')}
  ${F('sr','Original circular link',c.src,'url')}
  ${F('sn','Circular issued by',c.srcn,'','e.g. বাংলাদেশ ব্যাংকের বিজ্ঞপ্তি')}
  ${F('co','Course page',c.course,'','Site path, e.g. /running/petrobangla/; leave blank if none')}
  <div><label for="st">Status</label><select id="st">${opt(ST,c.st)}</select></div>
  <p class="msg" id="fm"></p>
  <div class="bar2"><button class="btn">Save</button>${j?'<button type="button" class="btn line" id="dup">Duplicate</button><button type="button" class="lnk" id="dl">Delete</button>':''}</div>
  </form>`;
  $('bk').onclick=toList;
  $('jf').onsubmit=async e=>{e.preventDefault();
    const v=id=>$(id).value.trim(),th=document.querySelector('input[name=th]:checked');
    const job={id:c.id,type:v('ty'),post:v('po'),org:v('or'),grade:v('gr'),seats:v('se'),nd:v('nd'),as:v('as'),ae:v('ae'),at:v('at'),amin:v('amin'),amax:v('amax'),aref:v('aref'),
      edu:v('ed'),edut:v('edut'),grp:[...document.querySelectorAll('input[name=gp]:checked')].map(x=>x.value),third:th&&th.value==='0'?0:null,other:v('ot'),
      fee:v('fe'),feet:v('ft'),admit:v('ad'),exam:v('ex'),est:$('es').checked?1:0,subj:v('sj').split(/[,،]/).map(s=>s.trim()).filter(Boolean),url:v('ur'),src:v('sr'),srcn:v('sn'),course:v('co')};
    const fm=$('fm'),st=v('st'),miss=[];
    if(!job.type)miss.push('Type');if(!job.post)miss.push('Post name');if(!job.org)miss.push('Organisation');
    if(st==='live'){if(!job.ae)miss.push('Deadline');if(!job.src)miss.push('Original circular link')}
    if(job.amax&&!job.aref)miss.push('Age cut-off date');
    if(miss.length){fm.textContent='Missing: '+miss.join(', ');fm.className='msg err';return}
    try{await api('admin/jobs',{job,st});fm.textContent='Saved.';fm.className='msg ok';await fetchAll();const nj=ALL.find(x=>x.id===c.id);if(!j&&nj)edit(nj),$('fm').textContent='Saved.',$('fm').className='msg ok'}
    catch(err){fm.textContent='Could not save: '+(err&&err.error||'check your connection');fm.className='msg err'}};
  if(j){
    $('dup').onclick=()=>edit(null,cur);
    $('dl').onclick=async function(){if(!this.dataset.sure){this.dataset.sure=1;this.textContent='Sure? Tap again';return}
      try{await api('admin/jobs/del',{id:c.id});toList()}catch(e){}};
  }
}
async function fetchAll(){ALL=(await api('admin/jobs')).jobs}
async function load(){
  try{await fetchAll();listView()}
  catch(e){$('app').innerHTML=e&&e.error==='login'?'<p>Please <a href="/account/">log in</a> first.</p>':e&&e.error==='admin'?'<p>This page is for admins only.</p>':'<p>Could not open. Check your connection and try again.</p>'}
}
if(location.hash==='#edit')history.replaceState(null,'',location.pathname);
load();
})();
</script>
<script src="/js/omr.js" defer></script>
</body>
</html>
