<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13294b">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learner review · Admin · Lyanna Books</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo/final-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--paper:#fbfaf7;--ink:#1d1f21;--muted:#5f6366;--rule:#d9d6cf;--card:#fff;--navy:#13294b;--soft:#e9edf4;--link:#13294b;--pink:#c8326a;
  --display:'Tiro Bangla',Georgia,serif;--body:'Noto Sans Bengali',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:var(--link)}
.bar{background:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top,0px))}
.bar img{width:26px;height:auto;display:block}.bar a{display:flex;gap:8px;align-items:center;color:#fff;text-decoration:none}.bar span{color:#e6c97a;font-size:14px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 120px}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 2px}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:26px 0 6px}
.sub{color:var(--muted);margin:0 0 12px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin:0 0 10px}
.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:3px;padding:8px 14px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--link);border:1px solid var(--rule)}
select{font:inherit;font-size:15px;padding:7px 8px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}th{color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
td small{display:block;color:var(--muted);font-size:12.5px}
@media(max-width:520px){th,td{padding:6px 4px}table{font-size:13.5px}}
.scroll{overflow-x:auto}.dim{color:var(--muted)}.ok{color:#1e7a46;font-weight:600}.bad{color:#b3261e;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
ul.say{margin:4px 0 0;padding-left:20px}ul.say li{margin:3px 0}
.meter{display:inline-block;width:64px;height:8px;background:var(--soft);border-radius:2px;vertical-align:middle;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--navy)}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--pink)}
.tag{font-size:12.5px;color:#8a5a00}
details{margin-top:6px}summary{cursor:pointer;color:var(--link);font-size:14.5px}
pre{white-space:pre-wrap;font-size:12.5px;background:var(--soft);padding:8px;border-radius:3px;margin:6px 0 0;max-height:260px;overflow:auto}
</style>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="adbar"><a class="adback" href="/admin/learners/">← Learners</a><span class="adname">Learner review</span></div>
<main class="wrap">
<h1 id="who">Learner review</h1>
<p class="sub" id="meta">Loading…</p>
<div class="row"><label for="goal" class="dim">Target exam</label><select id="goal"></select>
  <button class="btn ghost" id="copy">Copy summary for Claude</button></div>
<div id="out"></div>
</main>
<script src="/admin/review/review.js"></script>
<script>
const $=id=>document.getElementById(id),bn=x=>String(x);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=x=>x==null?'—':bn(x)+'%',D=x=>x==null?'—':(x>0?'+':x<0?'−':'')+bn(Math.abs(x));
const uid=(location.hash.slice(1)||new URLSearchParams(location.search).get('uid')||'').replace(/\D/g,'');
let J,M,QS,R,BAD;
Object.entries(LYReview.TARGETS).forEach(([k,t])=>$('goal').insertAdjacentHTML('beforeend',`<option value="${k}">${esc(t.name)}</option>`));
try{const g=localStorage.getItem('rv-goal');if(g&&LYReview.TARGETS[g])$('goal').value=g}catch(e){}
$('goal').onchange=()=>{try{localStorage.setItem('rv-goal',$('goal').value)}catch(e){}draw()};
async function get(u){const r=await fetch(u,{credentials:'same-origin',cache:'no-store'});if(r.status===401)throw 'login';if(r.status===403)throw 'admin';if(!r.ok)throw 'err';return r.json()}
function meter(v,mark){return `<span class="meter"><i style="width:${Math.max(0,Math.min(100,v||0))}%"></i>${mark!=null?`<b style="left:${mark}%"></b>`:''}</span>`}
const unsure='<span class="tag">Unsure (few questions)</span>';

function draw(){
  R=LYReview.build(J,M,QS,$('goal').value,BAD);const c=R.counts,a=R.all,h=R.habit,G=R.target;let o='';
  $('who').textContent=(J.user.name||'Learner');
  const GN={bcs:'BCS Prelim',pb:'Petrobangla',subreg:'Sub-Registrar',bank:'Bank',primary:'Primary teacher',ntrca:'NTRCA',other:'Other government job'};
  let gl='';if(J.user.goal){gl=`Own goal: <b>${esc(GN[J.user.goal]||J.user.goal)}</b>`;
    if(J.user.gdate){const mo=(+J.user.gdate.slice(0,4)-new Date().getFullYear())*12+(+J.user.gdate.slice(5)-1-new Date().getMonth());gl+=` (${bn(J.user.gdate)}${mo>=0?', about '+bn(mo)+' months left':''})`}
    if(!LYReview.TARGETS[J.user.goal])gl+=' <span class="dim">· No mark split for this exam yet; pick the closest one below</span>';gl+='<br>'}
  $('meta').innerHTML=gl+`${esc(J.user.email||'')} · ${bn(c.exams)} tests (${bn(c.att)} regular, ${bn(c.diag)} Diagnostic parts) · ${bn(c.unique)} unique questions`+
    (c.keyBad?` · <span class="tag">${bn(c.keyBad)} tests had an answer-key mismatch; their right/wrong is left out</span>`:'')+
    (c.noTime?` · <span class="dim">${bn(c.noTime)} have no timing data (old, or times didn't match)</span>`:'')+
    `<br><span class="dim" style="font-size:13px">Topic known for ${P(Math.round((c.unique-c.noMap)/c.unique*100))}, difficulty known for ${P(Math.round(c.withDiff/c.unique*100))} of questions`+
    (c.flagged?`; ${bn(c.flagged)} reported-wrong questions are left out of the hard/easy calculation (they return if you mark the <a href="/admin/reports/">report</a> "not wrong")`:'')+`</span>`;
  if(!c.exams){$('out').innerHTML='<div class="card dim">No tests with answers yet.</div>';return}

  // ১. এক নজরে
  const say=[];
  say.push(`Correct on <b>${P(a.acc)}</b> of the questions marked; answered ${P(a.attempt)} of questions. Under ${G.name} rules (−${bn(G.neg)} per wrong answer) the net score rate is <b>${P(R.risk.net)}</b>; ${bn(R.risk.lost)} marks lost to wrong answers.`);
  if(a.vsExp!=null)say.push(`Scores <b>${D(a.vsExp)}</b> percentage points ${a.vsExp>=0?'higher':'lower'} than the average of all learners on the same questions (difficulty adjusted).`);
  if(R.trend){const e=R.trend.early,l=R.trend.late,dv=e.vsExp!=null&&l.vsExp!=null?l.vsExp-e.vsExp:l.acc-e.acc;
    say.push(`From the first ${bn(R.trend.k)} tests to the last ${bn(R.trend.k)}: correct ${P(e.acc)} → ${P(l.acc)}`+(e.vsExp!=null&&l.vsExp!=null?` (vs all learners ${D(e.vsExp)} → ${D(l.vsExp)})`:'')+
      (R.trend.sure?(dv>=5?': <span class="ok">improving</span>':dv<=-5?': <span class="bad">dropping</span>':': about the same'):' <span class="dim">(no trend conclusion before 20 tests)</span>'));}
  const sg={bold:'Losing marks by gambling on hard questions (would have scored more by skipping them)',shy:'Skipping many easy questions too (giving up sure marks)',careless:'Making many mistakes even on easy questions that most learners get right'};
  R.risk.signs.forEach(x=>say.push('<span class="bad">'+sg[x]+'</span>'));
  if(R.weak.length)say.push('Weakest topics: '+R.weak.slice(0,3).map(t=>esc(t.name)).join(', '));
  if(R.match!=null)say.push(`Practice matches the ${G.name} mark split at <b>${bn(R.match)}/100</b>`);
  o+=`<h2>At a glance</h2><div class="card"><ul class="say">${say.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;

  // ২. লক্ষ্যের সঙ্গে মিল
  o+=`<h2>${esc(G.name)}: where marks can be gained</h2><div class="card scroll"><table><thead><tr><th>Subject</th><th>Practice / mark share</th><th class="n">Correct</th><th class="n">Gain</th></tr></thead><tbody>`+
    R.fit.map(f=>`<tr><td>${esc(f.name)}<small>${bn(f.marks)} marks</small></td><td>${meter(f.share,f.want)}<small>${bn(f.share)}% / ${bn(f.want)}%</small></td><td class="n">${f.n?P(f.acc)+(f.small?'<br>'+unsure:''):'<span class="dim">Not attempted</span>'}</td><td class="n"><b>${bn(f.gain)}</b></td></tr>`).join('')+
    `</tbody></table><p class="dim" style="font-size:13px;margin:6px 0 0">Pink line = the subject's share of exam marks; blue = share of questions the learner practised. Gain = marks × (0.80 − correct rate); with few questions the rate is taken as 50%.`+
    (R.outside?` ${bn(R.outside)} questions are outside the syllabus.`:'')+`</p></div>`;

  // ৩. বিষয়
  o+=`<h2>By subject</h2><div class="card scroll"><table><thead><tr><th>Subject</th><th class="n">Questions</th><th class="n">Correct</th><th class="n">vs all learners</th></tr></thead><tbody>`+
    R.subjects.map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${bn(s.n)}<small>marked ${P(s.attempt)}</small></td><td class="n">${P(s.acc)} ${s.small?'<br>'+unsure:''}</td><td class="n">${D(s.vsExp)}</td></tr>`).join('')+
    `</tbody></table><p class="dim" style="font-size:13px;margin:6px 0 0">"vs all learners" = percentage points above (+) or below (−) the average of all learners on the same questions. It stays fair even if the learner got more hard questions.</p></div>`;

  // ৪. টপিক
  const tl=L=>L.map(t=>`<tr><td>${esc(t.name)}<br><span class="dim" style="font-size:12.5px">${esc(t.subj)}</span></td><td class="n">${bn(t.ok)}/${bn(t.graded)}</td><td class="n">${P(Math.round(t.ok/t.graded*100))}</td></tr>`).join('');
  o+=`<h2>Weak and strong topics</h2><div class="card scroll">`+
    (R.weak.length?`<table><thead><tr><th>Weak (genuinely, not by luck)</th><th class="n">Correct/marked</th><th class="n">Rate</th></tr></thead><tbody>${tl(R.weak)}</tbody></table>`:'<p class="dim" style="margin:0">No topic can be called weak with confidence yet (needs at least 8 marked answers per topic).</p>')+
    (R.strong.length?`<details><summary>Strong topics (${bn(R.strong.length)})</summary><table><tbody>${tl(R.strong)}</tbody></table></details>`:'')+`</div>`;

  // ৫. ফাঁদ, কঠিন আর সহজ প্রশ্ন, ফাঁকা
  const v=R.avoid,rk=R.risk;
  o+=`<h2>Avoiding hard questions, mistakes on easy ones, blanks</h2><div class="card"><ul class="say">`+(v?`
    ${v.hardN>=10?`<li>On hard questions (very few learners get them right, ${bn(v.hardN)}): blank ${P(v.hardSkip)}, wrong ${P(v.hardWrong)}.${v.hardTried>=10?` Correct on those marked: ${P(v.hardAcc)}; net <b>${D(v.hardNet)}</b> marks ${v.hardNet<0?'<span class="bad">(loses by marking)</span>':'(gains by marking)'}.`:''}</li>`:''}
    ${v.easyN>=10?`<li>On easy questions (most learners get them right, ${bn(v.easyN)}): blank ${P(v.easySkip)}, wrong ${P(v.easyWrong)}.</li>`:''}
    ${v.hardN>=10&&v.easyN>=10?`<li>${v.hardSkip-v.easySkip>=15?'<span class="ok">Can spot hard questions and skip them.</span>':v.hardSkip-v.easySkip>=5?'Somewhat recognises hard questions.':'Marks hard and easy questions about the same way: does not tell which to avoid.'}</li>`:''}`:
    `<li class="dim">Not enough all-learner data yet to call questions hard/easy (a question needs at least 25 learners).</li>`)+
    `<li>Blanks: ${bn(rk.skipChose)} skipped on purpose, ${bn(rk.skipTail)} not reached at the end${rk.timeOut?`; <span class="bad">time ran out</span> in ${bn(rk.timeOut)} tests`:''}.</li>
    <li class="dim">In this exam, random guessing starts to pay off when the chance of being right is above ${bn(rk.breakEven)}%.</li></ul></div>`;

  // ৬. গতি, মনোযোগ, ক্লান্তি
  const p=R.pace,w=R.away,tr=R.tired;
  o+=`<h2>Pace and attention</h2><div class="card">`+(p.timedExams?`<ul class="say">
    ${p.median!=null?`<li>Median time between two consecutive answers: ${bn(Math.round(p.median))} seconds (from ${bn(p.seqN)} marks).</li>`:''}
    ${p.fastN>=10?`<li>Answered in under 6 seconds: ${P(p.fastPct)}; of those, wrong ${P(p.fastWrong)}, of the rest ${P(p.slowWrong)}.${p.fastWrong-p.slowWrong>=15?' <span class="bad">Rushing is causing mistakes.</span>':''}</li>`:''}
    ${p.noread?`<li>Marked in under 2.5 seconds (before reading the question): ${bn(p.noread)}.</li>`:''}
    ${p.rush>=5?`<li>Marked in the last minute: ${bn(p.rush)}, wrong ${P(p.rushWrong)}.</li>`:''}
    ${p.backPct!=null?`<li>${p.backPct<=10?'Answers in question order.':'Jumps back and forth (went back to an earlier question '+P(p.backPct)+' of the time).'}</li>`:''}
    <li>Away on another app/tab during tests: ${bn(Math.round(w.sec/60))} minutes total, ${bn(w.times)} times; over 30 seconds in ${bn(w.exams)} tests.</li>
    ${tr.drop!=null?`<li>In long tests (${bn(tr.exams)}), from the first half to the second half, difficulty adjusted, the correct rate ${tr.drop>0?'drops by '+bn(tr.drop)+'%':tr.drop<0?'rises by '+bn(-tr.drop)+'%':'stays the same'}${tr.drop>=10?' <span class="bad">(fatigue)</span>':''}.</li>`:''}</ul>
    <p class="dim" style="font-size:13px;margin:6px 0 0">All questions are on one page, so the gap between two marks means "no more than this"; fast marks are measured reliably, slow ones are not.</p>`:
    '<p class="dim" style="margin:0">Timing data will build up from tests taken after this update.</p>')+`</div>`;

  // ৭. মনে রাখা
  const m=R.mem;
  o+=`<h2>Retention and misconceptions</h2><div class="card">`+(m.again?`<ul class="say">
    <li>${bn(m.again)} questions came up more than once: wrong then right ${bn(m.learned)}, right then wrong ${bn(m.forgot)}, wrong both times ${bn(m.stuck)}.</li>
    ${m.same.length?`<li>${bn(m.same.length)} questions had the same wrong option repeatedly: a misconception, not forgetting.</li>`:''}</ul>
    ${m.same.length?`<details><summary>Questions</summary><pre>${m.same.slice(0,40).map(x=>x.qid+'  '+x.topic+'  ×'+x.times).join('\n')}</pre></details>`:''}`:
    '<p class="dim" style="margin:0">No question has come up twice yet.</p>')+`</div>`;

  // ৮. নিয়মিততা
  const hn=['Dawn','Morning','Noon','Afternoon','Evening','Night'],hl=['at dawn','in the morning','at noon','in the afternoon','in the evening','at night'],hm=Math.max(...h.hours);
  o+=`<h2>Consistency</h2><div class="card"><ul class="say">
    <li>Came on ${bn(h.days)} of ${bn(h.span)} days; longest streak ${bn(h.best)} days; ${bn(h.perDay)} tests per day on average.</li>
    <li>Last test: ${h.last?bn(h.last):'—'}.</li>
    <li>Studies most ${hl[h.hours.indexOf(hm)]}. ${h.hours.map((x,i)=>hn[i]+' '+bn(x)).join(' · ')}</li></ul></div>`;

  // ৯. ধারা
  o+=`<h2>Every 5 tests</h2><div class="card scroll"><table><thead><tr><th>Tests</th><th>Correct on marked</th><th class="n">vs all learners</th></tr></thead><tbody>`+
    R.steps.map(s=>`<tr><td>${bn(s.from)}–${bn(s.to)}</td><td>${meter(s.acc)} ${P(s.acc)}<small>marked ${P(s.attempt)}</small></td><td class="n">${D(s.vsExp)}</td></tr>`).join('')+`</tbody></table>
    <details><summary>All tests</summary><table><tbody>${R.exams.map(e=>`<tr><td>${bn(new Date(e.ts).toLocaleDateString('en-GB',{timeZone:'Asia/Dhaka'}))}</td><td>${esc(e.title)}</td><td class="n">${bn(e.rows.filter(r=>r.ok===1).length)}/${bn(e.n)}</td><td class="dim">${e.timed?'':'no timing'}${e.trust?'':' key mismatch'}</td></tr>`).join('')}</tbody></table></details></div>`;
  o+=`<p class="dim" style="font-size:13px">Question map ${esc(R.built||'')}. Scoring counts only the first time a question was seen; a subject/topic with fewer than ${bn(LYReview.MIN_N)} marked answers is shown as "Unsure".</p>`;
  $('out').innerHTML=o;
}
$('copy').onclick=()=>{if(!R)return;const t='The numbers below are the practice stats of a government-job/BCS candidate. From them, write a review for the candidate in simple Bengali: the top 3 problems, with evidence; what they are doing well; 3-5 specific tasks for the next two weeks. Do not draw conclusions from parts marked "uncertain". No shaming: honest facts and next steps.\n\n'+JSON.stringify(LYReview.summary(R));
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$('copy').textContent='Copied ✓'},()=>{const p=document.createElement('textarea');p.value=t;document.body.appendChild(p);p.select();document.execCommand('copy');p.remove();$('copy').textContent='Copied ✓'})};
(async()=>{
  if(!uid){$('meta').innerHTML='Which learner? <a href="/admin/learners/">Pick from the list</a>.';return}
  try{[J,M,QS,BAD]=await Promise.all([get('/api/admin/att?uid='+uid),get('/admin/data/qmap.json'),get('/api/qstat').catch(()=>({rows:[]})),get('/api/admin/repq').catch(()=>({qids:[]}))]);
    if(J.user.goal&&LYReview.TARGETS[J.user.goal])$('goal').value=J.user.goal;draw()}
  catch(e){$('meta').innerHTML=e==='login'?'Please <a href="/account/">log in</a> first (with the admin e-mail).':e==='admin'?'This e-mail is not on the admin list.':'Could not load, try again.'}
})();
</script>
</body>
</html>
