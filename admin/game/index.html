<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#13294b">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game · Admin · Lyanna Books</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo/final-icon.svg" type="image/svg+xml">
<script>/* ফন্ট: কম দামি ফোন/ধীর নেটে হালকা রূপ (tools/font_mode.py) */!function(){var n=navigator,c=n.connection||{},l=c.saveData||/2g/.test(c.effectiveType)||c.downlink<1||n.deviceMemory<=2;try{var q=location.search.match(/[?&]font=(lite|full|auto)/);if(q)localStorage.lyFont=q[1]=='auto'?'':q[1];if(localStorage.lyFont)l=localStorage.lyFont=='lite'}catch(e){}if(l)document.documentElement.classList.add('ly-lite');document.write(l?'<link rel="stylesheet" href="/fonts/lite.css">':'<link rel="preload" href="/fonts/AnekBangla-bengali.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/fonts/fonts.css">')}()</script><noscript><link rel="stylesheet" href="/fonts/fonts.css"></noscript>
<style>
:root{--paper:#f8f5ee;--ink:#1d1f21;--muted:#5f6366;--rule:#d9d6cf;--card:#fff;--navy:#13294b;--pink:#c8326a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 'Noto Sans Bengali',system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font:400 28px/1.3 'Tiro Bangla',Georgia,serif;margin:0 0 4px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.sh{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin:0 0 12px}
.sh b{color:var(--navy);font-size:17px}
.sh .m{font-size:14px;color:var(--muted);margin:2px 0 6px}
.sh button{font:inherit;font-size:14px;background:none;border:1px solid var(--rule);border-radius:3px;padding:4px 10px;color:var(--navy);cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
th,td{border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left}
th{color:var(--muted);font-weight:500}
</style>
<link rel="stylesheet" href="/css/omr.css">
<link rel="stylesheet" href="/admin/admin.css">
<style>
.bar{height:8px;background:#eee;border-radius:2px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--navy)}
td.hot{color:var(--pink);font-weight:600}
.tot{display:flex;gap:16px;margin:0 0 14px}.tot div{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:8px 12px}.tot b{display:block;font-size:22px;color:var(--navy)}
</style>
</head>
<body>
<div class="adbar"><a class="adback" href="/admin/">← Admin</a><span class="adname">Game</span></div>
<main class="wrap">
<h1>বুদ্ধির গেম</h1>
<p class="sub">প্রতিটা পর্যায়ে: কতজন শুরু করলেন, প্রতিটা রাউন্ডে কতজন পৌঁছালেন (কোথায় ছেড়ে যাচ্ছেন), ঠিকের হার আর গড় সময়। লাল = ছেড়ে যাওয়া বা ভুল বেশি। নাম নেই।</p>
<p class="sub"><label>সময়: <select id="days"><option value="7">শেষ ৭ দিন</option><option value="30" selected>শেষ ৩০ দিন</option><option value="365">শেষ ১ বছর</option></select></label></p>
<div id="out">আসছে…</div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
let names={};
fetch('/game/data/stages.json').then(r=>r.json()).then(j=>{(j.stages||[]).forEach(s=>names[s.id]=s.name)}).catch(()=>{}).finally(load);
$('days').onchange=load;
function load(){
  $('out').textContent='আসছে…';
  fetch('/api/admin/game?days='+$('days').value,{credentials:'same-origin'}).then(r=>r.json()).then(j=>{
    if(!j.stages){$('out').textContent=j.error==='login'?'আগে অ্যাডমিন হিসেবে লগইন করুন।':'অনুমতি নেই।';return}
    let h='<div class="tot"><div><b>'+bn(j.total.people||0)+'</b>জন খেলেছেন</div><div><b>'+bn(j.total.plays||0)+'</b>বার বসেছেন</div></div>';
    if(!j.stages.length){$('out').innerHTML=h+'<p>এখনো কোনো খেলা জমা হয়নি।</p>';return}
    h+=j.stages.map(s=>{
      const start=s.plays||0,rows=s.rounds;
      const by={};rows.forEach(x=>{(by[x.r]=by[x.r]||[]).push(x)});
      let prev=start,t='<table><tr><th>রাউন্ড</th><th>ধরন</th><th>পৌঁছালেন</th><th></th><th>ঠিক</th><th>গড় সময়</th><th>এখানে ছাড়লেন</th></tr>';
      for(let r=1;r<=10;r++){
        const L=by[r]||[],reach=L.reduce((a,x)=>Math.max(a,x.reach),0),n=L.reduce((a,x)=>a+x.n,0),ok=n?Math.round(L.reduce((a,x)=>a+(x.ok||0)*x.n,0)/n):null;
        const sec=L.length?Math.round(L.reduce((a,x)=>a+(x.sec||0)*x.n,0)/Math.max(1,n)):null,left=(s.left||{})[r]||0;
        const drop=prev?Math.round(100*(prev-reach)/prev):0;prev=reach||prev;
        t+='<tr><td>'+bn(r)+'</td><td>'+esc(L.map(x=>x.ty).join(', '))+'</td><td'+(drop>=15?' class="hot"':'')+'>'+bn(reach)+'</td><td><div class="bar"><i style="width:'+(start?Math.round(100*reach/start):0)+'%"></i></div></td><td'+(ok!=null&&ok<50?' class="hot"':'')+'>'+(ok==null?'-':bn(ok)+'%')+'</td><td>'+(sec==null?'-':bn(sec)+' সে')+'</td><td'+(left?' class="hot"':'')+'>'+bn(left)+'</td></tr>';
      }
      t+='</table>';
      return '<div class="sh"><b>'+esc(names[s.s]||s.s)+'</b><div class="m">'+bn(start)+' বার শুরু ('+bn(s.people||0)+' জন) · '+bn(s.done||0)+' বার শেষ'+(start?' ('+bn(Math.round(100*(s.done||0)/start))+'%)':'')+(s.ok!=null?' · শেষে গড়ে '+bn(s.ok)+'/১০':'')+(s.sec!=null?' · গড়ে '+bn(Math.round(s.sec/60))+' মিনিট':'')+'</div>'+t+'</div>';
    }).join('');
    $('out').innerHTML=h;
  }).catch(()=>{$('out').textContent='আনা গেল না।'});
}
})();
</script>
</body>
</html>
