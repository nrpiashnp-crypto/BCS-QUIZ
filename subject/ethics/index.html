<h1>নৈতিকতা, মূল্যবোধ ও সুশাসন</h1>
<p class="sub">২টি টপিক · প্রতিটিতে অনুশীলন, তারপর টপিক টেস্ট</p>
<div class="meter" aria-hidden="true"><i id="bar" style="width:0"></i></div>
<p class="pr" id="pr"></p>
<div class="tiles" id="list"><p class="sub">লোড হচ্ছে…</p></div>
<a class="mine" id="wrong" hidden style="margin-top:16px"></a>
</div>
<script>
/* রোডম্যাপ: /subject/data/ethics.json থেকে টপিক আর সেটের তালিকা। অগ্রগতি এই ফোনে 'subj:v1' =
   {t:{<টপিক>:{s:{<সেট>:[সঠিক,মোট,সময়]}, best:<টেস্টের সেরা নম্বর>, pass:true|false}}}; ভুল প্রশ্ন 'subj:w' (q/ পাতা লেখে)। */
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const fmt=x=>(x<0?'−':'')+bn(Number.isInteger(Math.abs(x))?Math.abs(x):Math.abs(x).toFixed(1));
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const P=get('subj:v1',{}),T=P.t||{},W=get('subj:w',{});
const GL={b:'বিসিএসের প্রশ্ন',x:'অন্য পরীক্ষার প্রশ্ন',l:'সম্ভাব্য প্রশ্ন'};
fetch('/subject/data/ethics.json').then(r=>r.json()).then(D=>{
  const list=document.getElementById('list');list.innerHTML='';
  let done=0,openId=null;
  D.topics.forEach(t=>{
    const p=T[t.id]||{},s=p.s||{},nd=t.sets.filter(x=>s[x.id]).length;
    if(p.pass)done++;else if(!openId)openId=t.id;
    const box=document.createElement('div');box.className='topic';box.id=t.id;
    const info=[`অনুশীলন ${bn(nd)}/${bn(t.sets.length)}`];if(p.best!=null)info.push(`টেস্ট ${fmt(p.best)}/${bn(p.n||D.test)}`);
    box.innerHTML=`<button type="button" class="tile${p.pass?' done':''}" aria-expanded="false"><span class="ic">${p.pass?'✓':bn(t.no)}</span><span class="tx"><b>${t.name}</b><small>${info.join(' · ')}</small></span><span class="bt">▾</span></button>`;
    const pan=document.createElement('div');pan.className='panel';pan.hidden=true;
    let h='';
    (D.kinds||['b','x','l']).forEach(k=>{const ss=t.sets.filter(x=>x.kind===k);if(!ss.length)return;
      h+=`<div class="step"><h3>${GL[k]||ss[0].label}</h3><div class="pills">`+ss.map(x=>`<a class="pill${s[x.id]?' ok':''}" href="/subject/q/?t=${t.id}&s=${x.id}">সেট ${bn(x.k)}</a>`).join('')+'</div></div>'});
    h+=`<div class="step"><h3>টপিক টেস্ট</h3><a class="go${nd?'':' lock'}" href="/subject/q/?t=${t.id}&s=test">${nd?`টেস্ট দিন: ${bn(D.test)} প্রশ্ন, সময়সহ`:'আগে অন্তত একটি সেট অনুশীলন করুন'}</a><p class="note">${bn(Math.round(D.pass*100))}% বা বেশি পেলে টপিক সম্পন্ন।</p></div>`;
    pan.innerHTML=h;box.appendChild(pan);
    box.firstChild.onclick=()=>{const o=pan.hidden;document.querySelectorAll('.topic').forEach(b=>{b.classList.remove('open');b.lastChild.hidden=true;b.firstChild.setAttribute('aria-expanded','false')});
      if(o){pan.hidden=false;box.classList.add('open');box.firstChild.setAttribute('aria-expanded','true')}};
    list.appendChild(box);
  });
  document.getElementById('bar').style.width=(done/D.topics.length*100)+'%';
  document.getElementById('pr').textContent=`${bn(done)}/${bn(D.topics.length)} টপিক সম্পন্ন`;
  const want=location.hash.slice(1)||openId;const el=want&&document.getElementById(want);
  if(el){el.firstChild.click();if(location.hash)el.scrollIntoView({block:'start'})}
  const nw=Object.values(W).filter(q=>q.tp&&q.tp.startsWith('ethics-')).length,w=document.getElementById('wrong');
  if(nw){w.href='/subject/q/?w=ethics';w.innerHTML=`ভুলের খাতা: <b>${bn(nw)}টি</b> প্রশ্ন আবার অনুশীলন করুন →`;w.hidden=false}
}).catch(()=>{document.getElementById('list').innerHTML='<p class="sub">তালিকা আনা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।</p>'});
</script>
